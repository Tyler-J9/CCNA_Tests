function examPage(){return `${header('Make space to focus','A full practice run.','Practice across all six CCNA v1.1 domains. Your exam ends when you submit or the timer expires; explanations stay hidden until then.')}${resumeBanner()}<div class="two"><div class="panel"><h2>Set your exam</h2><div class="formrow"><label class="field">Questions<select id="exam-count"><option>60</option><option selected>100</option><option>120</option></select></label><label class="field">Time limit<select id="exam-time"><option value="60">60 minutes</option><option value="90">90 minutes</option><option value="120" selected>120 minutes</option><option value="150">150 minutes</option></select></label></div><p class="small muted">100 questions / 120 minutes is this app’s default. Cisco publishes a 120-minute v1.1 exam duration; the question count here is a practice setting.</p><div class="examweights">${DOMAINS.map(d=>`<i style="width:${d.weight}%"></i>`).join('')}</div>${DOMAINS.map(d=>`<div class="row spread small" style="margin:9px 0"><span>${esc(d.name)}</span><b>${d.weight}%</b></div>`).join('')}<button class="btn primary" style="margin-top:24px" data-action="start-exam">Begin timed exam →</button></div><div class="panel"><h2>How this works</h2><ul class="checklist"><li>Single answer, multiple selection, matching, and output interpretation can appear.</li><li>Flag anything you guessed on. You can revisit questions before submitting.</li><li>The clock continues if you refresh or close the page. Reopening after the deadline submits the saved answers.</li><li>Unanswered and partially correct questions count as incorrect. There is no partial credit.</li><li>After submission, review every explanation and its Cisco documentation link.</li></ul><div class="notice">This is independent practice, with original questions. It does not reproduce Cisco’s live exam or its scoring system.</div><a class="source-link" href="${esc(SOURCES.blueprint[1])}" target="_blank" rel="noopener noreferrer">View Cisco’s official exam blueprint ↗</a></div></div>${footer()}`;}
function weaknessPage(){let all=stats();let low=all.filter(s=>s.distinct>=3&&s.score<75).sort((a,b)=>a.score-b.score);let pending=all.filter(s=>s.distinct<3);let m=missed(),f=flags();return `${header('Make your next session count','Find the gaps. Close them.','Low-scoring topics use your latest 20 attempts per topic, once you have tried at least 3 different questions. Repeated attempts remain visible in that score.')}${resumeBanner()}${statCards([[low.length,'Low-scoring topics'],[m.length,'Currently missed questions'],[f.size,'Flagged questions'],[pending.length,'Topics needing more evidence']])}<div class="cards"><div class="panel"><h3>Target low scores</h3><p class="small muted">Up to 20 questions from topics below 75%, with currently missed questions first.</p><button class="btn primary" data-action="start-weak" ${low.length?'':'disabled'}>Practice low-scoring topics</button></div><div class="panel"><h3>Missed-question review</h3><p class="small muted">Retry questions whose most recent attempt was incorrect. A correct retry clears the missed list.</p><button class="btn" data-action="retry-missed" ${m.length?'':'disabled'}>Retry missed questions</button></div><div class="panel"><h3>Guessed or unsure?</h3><p class="small muted">Your flags stay until you clear them, even if you answered correctly.</p><button class="btn" data-action="retry-flagged" ${f.size?'':'disabled'}>Practice flagged questions</button></div></div><div class="sectionhead"><h2>Low-scoring topics</h2><span class="pill">Below 75% · Practice target</span></div><div class="panel">${low.length?`<div class="tablewrap"><table><thead><tr><th>Topic</th><th>Recent accuracy</th><th>Evidence</th><th>Next step</th></tr></thead><tbody>${low.map(s=>`<tr><td>${esc(s.topic)}</td><td><b>${s.score}%</b></td><td>${s.n} attempts / ${s.distinct} questions</td><td><button class="btn" data-topic-practice="${esc(s.topic)}">Practice</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h3>${state.attempts.length?'No established low-scoring topics yet':'Start with a short diagnostic'}</h3>Try a mixed 30-question session to collect a baseline. Unattempted topics are not counted as weaknesses.<br><button class="btn primary" style="margin-top:18px" data-action="diagnostic">Start diagnostic →</button></div>`}</div><div class="sectionhead"><h2>All topic results</h2></div><div class="panel tablewrap"><table><thead><tr><th>Topic</th><th>Recent accuracy</th><th>Questions tried</th><th>Status</th></tr></thead><tbody>${all.map(s=>`<tr><td>${esc(s.topic)}</td><td>${s.score===null?'—':s.score+'%'}</td><td>${s.distinct} in latest ${s.n} attempts</td><td>${s.distinct<3?'More evidence needed':s.score<75?'Focus area':'At or above target'}</td></tr>`).join('')}</tbody></table></div>${footer()}`;}
function startSession(mode,pool,minutes=0){if(!pool.length){toast('No questions match these settings. Select more topics or another format.');return;}const start=()=>{active={id:uid(),mode,ids:pool.map(q=>q.id),at:Date.now(),deadline:minutes?Date.now()+minutes*60000:null,index:0,answers:{},checked:{},flags:Object.fromEntries(pool.map(q=>[q.id,!!state.flags[q.id]?.value])),orders:Object.fromEntries(pool.map(q=>[q.id,E.shuffle((q.type==='match'?q.pairs:q.options).map((_,i)=>i))]))};saveActive();go('quiz');};if(active)ask('Replace the saved session?','Checked practice answers are already saved. The current unfinished session will be replaced.','Replace session',start);else start();}
function current(){return active?byId[active.ids[active.index]]:null;}
function flagValue(q){return active&&Object.hasOwn(active.flags,q.id)?active.flags[q.id]:!!state.flags[q.id]?.value;}
function toggleFlag(id){const q=byId[id];const on=!(active?.ids.includes(id)?flagValue(q):!!state.flags[id]?.value);if(active?.ids.includes(id)){active.flags[id]=on;saveActive();}if(active?.mode!=='exam'){state.flags[id]={value:on,at:Date.now()};persist();}render();}
function answerText(q,a){if(!Array.isArray(a)||!a.length)return 'Unanswered';if(q.type==='match')return q.pairs.map((p,i)=>p[0]+' → '+(q.pairs[a[i]]?.[1]||'Unassigned')).join('; ');return a.map(i=>q.options[i]).join(' • ');}
function explanation(q,a){let good=E.correct(q,a);let solution=q.type==='match'?q.pairs.map(p=>p[0]+' → '+p[1]).join('; '):q.correct.map(i=>q.options[i]).join(' • ');let source=SOURCES[q.source];return `<div class="answerbox" data-explanation><h3>${good?'Correct':'Review this one'}</h3><p><strong>Your answer:</strong> ${esc(answerText(q,a))}</p><p><strong>Correct answer${q.correct.length>1?'s':''}:</strong> ${esc(solution)}</p><p>${esc(q.explanation)}</p><a class="source-link" href="${esc(source[1])}" target="_blank" rel="noopener noreferrer">${esc(source[0])} ↗</a><span class="small muted">Read the related Cisco section to verify the concept; CLI details can vary by platform.</span></div>`;}
function quizPage(){if(!active)return `${header('Ready when you are','No active session.','Choose a topic or start an exam to begin.')}<button class="btn primary" data-mode="topics">Choose topics</button>`;let q=current(),a=active.answers[q.id]||[],checked=active.checked[q.id],isExam=active.mode==='exam',order=active.orders[q.id],n=active.ids.length;
let controls=q.type==='match'?`<p class="small muted">Drag each answer onto its matching row, or use the dropdowns with a keyboard or touch. Each answer is used once.</p><div class="matchbank">${order.map(i=>`<span draggable="${checked?'false':'true'}" class="chip" data-drag="${i}">${esc(q.pairs[i][1])}</span>`).join('')}</div>${q.pairs.map((p,i)=>`<div class="matchrow"><strong>${esc(p[0])}</strong><div class="drop" data-drop="${i}"><select aria-label="Match ${esc(p[0])}" data-match="${i}" ${checked?'disabled':''}><option value="-1">Choose an answer…</option>${order.map(j=>`<option value="${j}" ${a[i]===j?'selected':''}>${esc(q.pairs[j][1])}</option>`).join('')}</select></div></div>`).join('')}`:`<div class="options">${order.map((j,i)=>`<button class="option ${a.includes(j)?'selected':''}" data-answer="${j}" aria-pressed="${a.includes(j)}" ${checked?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(q.options[j])}</span></button>`).join('')}</div>`;
return `<div class="row spread" style="margin-bottom:20px"><div><p class="eyebrow">${isExam?'Timed exam':active.mode==='weakness'?'Targeted practice':active.mode==='review'?'Review practice':'Topic practice'}</p><h2>${esc(q.topic)}</h2></div><span class="pill">${active.index+1} / ${n}</span></div><div class="quizlayout"><section class="panel"><div class="row spread"><div class="row"><span class="pill bluepill">${esc(q.level)}</span><span class="small muted">${q.type==='match'?'Drag & drop':q.type==='multi'?'Select '+q.correct.length+' answers':'Select one answer'}${q.cli?' · Output interpretation':''}</span></div><button class="btn flag ${flagValue(q)?'on':''}" data-flag="${q.id}" aria-pressed="${flagValue(q)}">⚑ ${flagValue(q)?'Flagged':'Flag for review'}</button></div><h2 class="question" tabindex="-1">${esc(q.stem)}</h2>${q.cli?`<pre class="terminal">${esc(q.cli)}</pre>`:''}${controls}${checked&&!isExam?explanation(q,a):''}<div class="row spread" style="margin-top:24px"><button class="btn" data-action="previous" ${active.index===0?'disabled':''}>← Previous</button><div class="row">${!isExam&&!checked?`<button class="btn primary" data-action="check" ${E.answered(q,a)?'':'disabled'}>Check answer</button>`:''}<button class="btn ${isExam||checked?'primary':''}" data-action="next">${active.index===n-1?'Finish session':'Next →'}</button></div></div></section><aside class="quizside panel"><span class="tiny muted">${isExam?'Time remaining':'Your session'}</span>${isExam?'<div class="timer" id="timer">—</div>':`<p class="small muted">${Object.keys(active.checked).length} checked · ${n} questions</p>`}<div class="bar"><i style="width:${percent(active.ids.filter(id=>E.answered(byId[id],active.answers[id])).length,n)}%"></i></div><div class="navigator">${active.ids.map((id,i)=>`<button class="qnum ${i===active.index?'current':''} ${E.answered(byId[id],active.answers[id])?'done':''} ${flagValue(byId[id])?'flagged':''}" data-jump="${i}" aria-label="Question ${i+1}${flagValue(byId[id])?', flagged':''}${E.answered(byId[id],active.answers[id])?', answered':', unanswered'}">${i+1}</button>`).join('')}</div><p class="small muted">Filled = answered · Dot = flagged</p><button class="btn dark" data-action="finish">${isExam?'Submit exam':'End & review'}</button><p class="small muted">${isExam?'Answers stay hidden until submission.':'Use flags to keep track of correct guesses too. Unchecked answers are not scored.'}</p></aside></div>`;}
function choose(value){if(!active||tick())return;let q=current();if(active.checked[q.id])return;let a=active.answers[q.id]||[];active.answers[q.id]=q.type==='multi'?(a.includes(value)?a.filter(x=>x!==value):[...a,value]):[value];saveActive();render();document.querySelector('[data-answer="'+value+'"]')?.focus();}
function matchAnswer(row,value){if(!active||tick())return;let q=current();if(active.checked[q.id])return;let a=active.answers[q.id]||Array(q.pairs.length).fill(-1);a=[...a];if(value>=0)a=a.map((x,i)=>i!==row&&x===value?-1:x);a[row]=value;active.answers[q.id]=a;saveActive();render();document.querySelector('[data-match="'+row+'"]')?.focus();}
function record(q,a,session,at=Date.now()){let attempt={id:session.id+':'+q.id,qid:q.id,sessionId:session.id,mode:session.mode,answer:Array.isArray(a)?a:[],correct:E.correct(q,a),flagged:flagValue(q),at};state.attempts=state.attempts.filter(x=>x.id!==attempt.id);state.attempts.push(attempt);}
function check(){if(!active||active.mode==='exam'||tick())return;let q=current(),a=active.answers[q.id];if(!E.answered(q,a)||active.checked[q.id])return;active.checked[q.id]=true;record(q,a,active);persist();saveActive();render();$('[data-explanation]')?.scrollIntoView({block:'nearest',behavior:'smooth'});}
function finish(auto=false){if(!active)return;const run=()=>{if(!active)return;const s=active,end=auto?s.deadline:Date.now();if(s.mode==='exam')s.ids.forEach(id=>record(byId[id],s.answers[id],s,end));for(let [id,on]of Object.entries(s.flags))state.flags[id]={value:on,at:end};let attempts=state.attempts.filter(a=>a.sessionId===s.id);let summary={id:s.id,mode:s.mode,at:s.at,endedAt:end,ids:s.ids,answers:s.answers,flags:s.flags,scored:attempts.length,correct:attempts.filter(a=>a.correct).length,timedOut:auto};state.sessions=state.sessions.filter(x=>x.id!==s.id);state.sessions.push(summary);persist();active=null;saveActive();resultId=s.id;go('results');if(auto)toast('Time expired. Your saved answers have been submitted.');};if(auto)return run();let n=active.ids.filter(id=>!E.answered(byId[id],active.answers[id])).length;ask(active.mode==='exam'?'Submit your exam?':'Finish this practice session?',active.mode==='exam'?`${n} unanswered question${n===1?'':'s'} will count as incorrect. Submission reveals explanations and ends the timer.`:'Checked answers are saved. Unchecked questions will not affect your accuracy.','Finish & review',run);}
function tick(){if(active?.mode!=='exam')return false;let remaining=active.deadline-Date.now();if(remaining<=0){if($('#confirm').open)$('#confirm').close();finish(true);return true;}let t=$('#timer');if(t){let sec=Math.ceil(remaining/1000);t.textContent=Math.floor(sec/60).toString().padStart(2,'0')+':'+(sec%60).toString().padStart(2,'0');t.style.color=sec<300?'#b1441f':'';}return false;}
function reviewCard(q,a,flagged=false){return `<details class="reviewitem"><summary>${esc(q.stem)}<div class="reviewmeta">${q.id.toUpperCase()} · ${esc(q.topic)} · ${a?E.correct(q,a)?'Correct':'Incorrect / unanswered':'Not attempted'}${flagged?' · Flagged':''}</div></summary>${q.cli?`<pre class="terminal">${esc(q.cli)}</pre>`:''}${explanation(q,a)}<button class="btn flag ${state.flags[q.id]?.value?'on':''}" data-flag="${q.id}">${state.flags[q.id]?.value?'Clear flag':'Flag for review'}</button></details>`;}
function resultsPage(){let s=state.sessions.find(x=>x.id===resultId)||state.sessions.at(-1);if(!s)return header('Your progress','No completed sessions yet.','Complete a practice session or exam to see its breakdown.');let attempts=state.attempts.filter(a=>a.sessionId===s.id),miss=attempts.filter(a=>!a.correct).length;return `${header(s.mode==='exam'?'Exam results':'Session results',s.timedOut?'Time’s up. Let’s review.':'Every attempt teaches you something.',new Date(s.endedAt).toLocaleString()+' · '+(s.mode==='exam'?'All exam questions scored.':'Only checked questions scored.'))}<div class="two"><div class="panel"><div class="row spread"><div><div class="scorebig">${s.scored?percent(s.correct,s.scored)+'%':'—'}</div><p class="muted">${s.correct} correct out of ${s.scored} scored</p></div><span class="pill bluepill">Practice score</span></div><p class="small muted">${miss} incorrect · ${Object.values(s.flags).filter(Boolean).length} session flags · ${s.ids.length-s.scored} unscored</p><div class="row"><button class="btn primary" data-action="retry-session" data-id="${s.id}" ${miss?'':'disabled'}>Retry missed from this session</button>${link('home','Dashboard','btn')}</div></div><div class="panel"><h3>Domain breakdown</h3>${DOMAINS.map((d,i)=>{let a=attempts.filter(x=>byId[x.qid].domain===i);return `<div class="row spread small" style="padding:7px 0"><span>${esc(d.name)}</span><b>${a.length?percent(a.filter(x=>x.correct).length,a.length)+'% ('+a.length+')':'—'}</b></div>`;}).join('')}</div></div><div class="sectionhead"><h2>Answers & explanations</h2><label class="field">Show<select id="results-filter"><option value="all">All questions</option><option value="missed">Incorrect only</option><option value="flagged">Flagged in session</option></select></label></div><div id="result-list">${s.ids.map(id=>`<div data-result-item="${id}" data-missed="${attempts.some(a=>a.qid===id&&!a.correct)}" data-flagged="${!!s.flags[id]}">${reviewCard(byId[id],s.answers[id],s.flags[id])}</div>`).join('')}</div>${footer()}`;}
function reviewPage(){let last=E.latest(state.attempts),flagged=flags();let pool=BANK.filter(q=>reviewFilter==='missed'?last[q.id]&&!last[q.id].correct:reviewFilter==='flagged'?flagged.has(q.id):!!last[q.id]);if(reviewQuery)pool=pool.filter(q=>(q.stem+' '+q.topic+' '+q.id).toLowerCase().includes(reviewQuery.toLowerCase()));return `${header('Keep the useful lessons','Your review collection.','Review recent misses, revisit uncertain answers, and use the Cisco references to verify each explanation. Flags are yours to clear.') }<div class="row spread"><div class="row">${[['missed','Missed ('+missed().length+')'],['flagged','Flagged ('+flagged.size+')'],['all','All attempted']].map(([v,l])=>`<button class="btn ${reviewFilter===v?'primary':''}" data-review-filter="${v}">${l}</button>`).join('')}</div><button class="btn" data-action="export">Export progress ↓</button></div><input class="search" id="review-search" placeholder="Search question, ID or topic…" aria-label="Search review questions" value="${esc(reviewQuery)}"><div id="review-list">${pool.length?pool.map(q=>reviewCard(q,last[q.id]?.answer,flagged.has(q.id))).join(''):'<div class="panel empty">No questions in this view yet. Complete a session or flag a question for review.</div>'}</div>${footer()}`;}
function historyPage(){let sessions=[...state.sessions].sort((a,b)=>b.endedAt-a.endedAt);return `${header('Visible progress','Your practice history.','Results stay in this browser. Export a backup to move them to another browser or device. Import merges records without counting the same attempt twice.')}<div class="row"><button class="btn primary" data-action="export">Export progress ↓</button><label class="btn" for="import-file">Import progress ↑</label><input id="import-file" type="file" accept=".json,application/json" hidden></div><div class="panel tablewrap" style="margin-top:24px">${sessions.length?`<table><thead><tr><th>Date</th><th>Mode</th><th>Score</th><th>Questions</th><th></th></tr></thead><tbody>${sessions.map(s=>`<tr><td>${esc(new Date(s.endedAt).toLocaleString())}</td><td>${esc(s.mode)}</td><td>${s.scored?percent(s.correct,s.scored)+'%':'—'}</td><td>${s.scored} scored</td><td><button class="btn" data-result="${s.id}">Review</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Completed sessions will appear here.</div>'}</div><div class="notice">Browser data is local to this device and profile. Clearing site data or using private browsing can remove it. Keep an exported backup.</div>${footer()}`;}
function sourcesPage(){return `${header('Check the primary reference','Trust, then verify.','Every answer explanation links to an official Cisco reference. These are reference sections, not claims that Cisco authored or endorsed the practice questions.')}<div class="panel"><h3>Learning companion</h3><p>Topic labels follow the concepts covered in Jeremy’s IT Lab. Use the course video and Packet Tracer lab alongside your practice; the bank is independently authored.</p><a href="https://courses.jeremysitlab.com/p/ccna" target="_blank" rel="noopener noreferrer">Jeremy’s IT Lab course outline ↗</a><p class="small muted">Blueprint checked November 20, 2026. Questions target 200-301 v1.1. The 100 applied scenarios use fixed data so progress stays tied to stable question IDs.</p></div><div class="sectionhead"><h2>Cisco reference directory</h2></div><div class="panel">${Object.entries(SOURCES).map(([key,s])=>`<p><a href="${esc(s[1])}" target="_blank" rel="noopener noreferrer">${esc(s[0])} ↗</a></p>`).join('')}</div>${footer()}`;}
function render(){if(active?.mode==='exam'&&route!=='quiz')route='quiz';const nav=[['home','⌂','Dashboard'],['topics','▦','Topic practice'],['exam','◷','Exam mode'],['weakness','⌁','Weakness mode'],['review','⚑','Review questions'],['history','↗','Results & backup'],['sources','≡','References']];const title=nav.find(x=>x[0]===route)?.[2]||(route==='quiz'?'Practice session':'Session results');let body=({home,topics:topicPage,exam:examPage,weakness:weaknessPage,quiz:quizPage,results:resultsPage,review:reviewPage,history:historyPage,sources:sourcesPage}[route]||home)();$('#boot').hidden=true;$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><a class="brand" href="#home" data-mode="home"><span class="brandmark"><i></i><i></i><i></i></span>Packet Practice</a><div><p class="tiny">Learning workspace</p><nav class="nav" aria-label="Main navigation">${nav.map(([mode,icon,label])=>link(mode,`<span class="navicon" aria-hidden="true">${icon}</span>${label}`,route===mode?'active':'')).join('')}</nav></div><div class="sidebottom"><p><span class="dot"></span>CCNA 200-301 v1.1</p><p>Small sessions.<br>Steady progress.</p><span>420 original questions</span></div></aside><main class="main"><div class="topbar"><div class="crumb">CCNA Lab <span style="margin:0 10px;color:#b0b5bf">/</span> ${title}</div><span class="pill">${storageError?'Session memory only':'Progress saved on this device'}</span></div>${storageError?`<div class="alert">${esc(storageError)}</div>`:''}${syncWarning?`<div class="alert">${esc(syncWarning)}</div>`:''}<div class="content">${body}</div></main></div>`;tick();}
function exportProgress(){const payload={app:'packet-practice',version:1,bankVersion:DATA.version,exportedAt:Date.now(),state};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CCNA-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function validateImport(raw){if(raw.app!=='packet-practice'||raw.version!==1||!raw.state||!Array.isArray(raw.state.attempts)||!Array.isArray(raw.state.sessions)||!raw.state.flags||typeof raw.state.flags!=='object')throw Error('Not a supported Packet Practice backup.');const s=raw.state;if(s.attempts.length>100000||s.sessions.length>10000)throw Error('Backup is too large.');for(const a of s.attempts){if(!Object.hasOwn(byId,a.qid)||typeof a.id!=='string'||!/^[a-zA-Z0-9:._-]+$/.test(a.id)||typeof a.sessionId!=='string'||!/^[a-zA-Z0-9:._-]+$/.test(a.sessionId)||!Number.isFinite(a.at)||!Array.isArray(a.answer)||a.answer.some(x=>!Number.isInteger(x)||x< -1||x>100))throw Error('Invalid attempt record.');if(a.answer.some(x=>x>=(byId[a.qid].type==='match'?byId[a.qid].pairs.length:byId[a.qid].options.length)))throw Error('Answer index out of range.');a.correct=E.correct(byId[a.qid],a.answer);}for(const s1 of s.sessions){if(typeof s1.id!=='string'||!/^[a-zA-Z0-9:._-]+$/.test(s1.id)||!['practice','exam','weakness','review'].includes(s1.mode)||!Array.isArray(s1.ids)||!s1.ids.every(id=>Object.hasOwn(byId,id))||new Set(s1.ids).size!==s1.ids.length||!Number.isFinite(s1.at)||!Number.isFinite(s1.endedAt)||!s1.answers||!s1.flags)throw Error('Invalid session record.');let ats=s.attempts.filter(a=>a.sessionId===s1.id);s1.scored=ats.length;s1.correct=ats.filter(a=>a.correct).length;}for(const [id,v]of Object.entries(s.flags))if(!Object.hasOwn(byId,id)||!v||typeof v.value!=='boolean'||!Number.isFinite(v.at))throw Error('Invalid flag record.');return s;}
document.addEventListener('click',e=>{let t=e.target.closest('[data-mode],[data-action],[data-answer],[data-flag],[data-jump],[data-review-filter],[data-topic-practice],[data-result]');if(!t)return;if(t.dataset.mode){e.preventDefault();let mode=t.dataset.mode;if(active?.mode==='exam'){go('quiz');if(mode!=='quiz')toast('Submit your timed exam to unlock other modes.');return;}let url=modeURL(mode);if(url[0]!=='#'&&new URL(url).origin!==location.origin){location.href=url;return;}go(mode);return;}if(t.dataset.answer!==undefined)return choose(Number(t.dataset.answer));if(t.dataset.flag)return toggleFlag(t.dataset.flag);if(t.dataset.jump!==undefined&&active){active.index=Number(t.dataset.jump);saveActive();render();return;}if(t.dataset.reviewFilter){reviewFilter=t.dataset.reviewFilter;render();return;}if(t.dataset.topicPractice){startSession('weakness',E.shuffle(BANK.filter(q=>q.topic===t.dataset.topicPractice)).slice(0,20));return;}if(t.dataset.result){resultId=t.dataset.result;go('results');return;}
const action=t.dataset.action;
if(action==='resume')return go('quiz');if(action==='check')return check();if(action==='finish')return finish();if(action==='export')return exportProgress();if(action==='select-all'||action==='select-none'){document.querySelectorAll('input[name=topic]').forEach(el=>{el.checked=action==='select-all';if(el.checked)selectedTopics.add(el.value);else selectedTopics.delete(el.value);});$('#selection-count').textContent=selectedTopics.size+' topics selected';return;}
if(action==='start-practice'){let format=$('#practice-format').value,n=$('#practice-count').value,pool=BANK.filter(q=>selectedTopics.has(q.topic)&&(format==='all'||(format==='cli'?!!q.cli:q.type===format)));if($('#practice-pool').value==='unseen'){let seen=new Set(state.attempts.map(a=>a.qid));pool=pool.filter(q=>!seen.has(q.id));}pool=E.shuffle(pool);startSession('practice',n==='all'?pool:pool.slice(0,Number(n)));return;}
if(action==='start-exam')return startSession('exam',E.exam(BANK,Number($('#exam-count').value)),Number($('#exam-time').value));if(action==='diagnostic')return startSession('practice',E.exam(BANK,30));if(action==='start-weak')return startSession('weakness',E.weakness(BANK,state.attempts));if(action==='retry-missed')return startSession('review',E.shuffle(missed()).slice(0,30));if(action==='retry-flagged')return startSession('review',E.shuffle(BANK.filter(q=>flags().has(q.id))).slice(0,30));if(action==='retry-session'){let ids=state.attempts.filter(a=>a.sessionId===t.dataset.id&&!a.correct).map(a=>a.qid);return startSession('review',E.shuffle(ids.map(id=>byId[id])));}
if(active&&['previous','next'].includes(action)){if(tick())return;if(action==='next'&&active.index===active.ids.length-1)return finish();active.index+=action==='next'?1:-1;saveActive();render();$('.question')?.focus();}
});
document.addEventListener('change',async e=>{let t=e.target;if(t.name==='topic'){t.checked?selectedTopics.add(t.value):selectedTopics.delete(t.value);$('#selection-count').textContent=selectedTopics.size+' topics selected';}if(t.dataset.match!==undefined)matchAnswer(Number(t.dataset.match),Number(t.value));if(t.id==='results-filter')document.querySelectorAll('[data-result-item]').forEach(el=>el.hidden=t.value!=='all'&&el.dataset[t.value]!=='true');if(t.id==='import-file'&&t.files[0]){try{if(t.files[0].size>15000000)throw Error('Backup exceeds 15 MB.');const incoming=validateImport(JSON.parse(await t.files[0].text()));state=E.merge(state,incoming);persist();render();toast('Progress imported and merged.');}catch(err){toast('Import failed: '+err.message);}}});
document.addEventListener('input',e=>{if(e.target.id==='review-search'){let pos=e.target.selectionStart;reviewQuery=e.target.value;render();$('#review-search').focus();$('#review-search').setSelectionRange(pos,pos);}});
document.addEventListener('dragstart',e=>{let c=e.target.closest('[data-drag]');if(c){e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',e=>{let d=e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>e.target.closest('[data-drop]')?.classList.remove('over'));
document.addEventListener('drop',e=>{let d=e.target.closest('[data-drop]');if(!d)return;e.preventDefault();let raw=e.dataTransfer.getData('text/plain');if(!/^\d+$/.test(raw)||current()?.type!=='match')return;let n=Number(raw);if(Number.isInteger(n)&&n>=0&&n<current().pairs.length)matchAnswer(Number(d.dataset.drop),n);});
window.addEventListener('hashchange',()=>{route=location.hash.slice(1)||DEFAULT_MODE;render();});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{state=E.merge(state,JSON.parse(e.newValue));if(route!=='quiz')render();}catch{}}if(e.key===ACTIVE){try{active=JSON.parse(e.newValue||'null');if(route==='quiz')render();}catch{}}});
window.addEventListener('focus',()=>{tick();if(bridgeReady)bridge.contentWindow.postMessage({type:'ccna:get'},bridgeOrigin);});document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
function setupBridge(){const home=globalThis.CCNA_DEPLOY?.homeOrigin;if(!home||location.protocol==='file:')return;try{bridgeOrigin=new URL(home).origin;}catch{return;}if(bridgeOrigin===location.origin)return;bridge=document.createElement('iframe');bridge.hidden=true;bridge.title='Local progress synchronization';bridge.src=bridgeOrigin+'/storage-bridge.html';bridge.onload=()=>bridge.contentWindow.postMessage({type:'ccna:merge',state},bridgeOrigin);document.body.appendChild(bridge);window.addEventListener('message',e=>{if(e.origin!==bridgeOrigin||e.source!==bridge.contentWindow||!e.data)return;if(e.data.type==='ccna:ready'){bridgeReady=true;bridge.contentWindow.postMessage({type:'ccna:merge',state},bridgeOrigin);}if(e.data.type==='ccna:state'){bridgeReady=true;state=E.merge(state,e.data.state);persist(false);syncWarning='';if(route!=='quiz')render();}if(e.data.type==='ccna:error'){syncWarning='Shared progress is blocked by your browser. This mode still saves locally; Export / Import can move your history.';render();}});setTimeout(()=>{if(!bridgeReady){syncWarning='Could not connect to shared local progress. This mode saves independently; use Export / Import if needed.';render();}},5000);}
render();setupBridge();setInterval(tick,500);
</script></body></html>
