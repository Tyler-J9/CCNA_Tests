e highest eligible loopback IPv4 address", "The lowest physical interface IP", "The highest TCP port", "The VLAN with the most hosts"], "correct": [0], "explanation": "Loopback selection precedes nonloopback interface selection in the usual IOS router-ID process.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q149", "domain": 2, "topic": "OSPF", "level": "Troubleshooting", "stem": "Two routers use the same OSPF router ID. What should you do?", "options": ["Assign unique IDs and restart the relevant process when appropriate", "Give them matching MAC addresses", "Set both priorities to 255", "Disable all routing"], "correct": [0], "explanation": "Duplicate router IDs undermine identification and topology information; plan process changes to avoid unintended disruption.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q150", "domain": 2, "topic": "OSPF", "level": "Foundation", "stem": "Which IP protocol number does OSPFv2 use?", "options": ["89", "TCP 89", "UDP 520", "6"], "correct": [0], "explanation": "OSPFv2 runs directly over IP protocol 89; it does not use a TCP or UDP port.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q151", "domain": 2, "topic": "OSPF", "level": "Foundation", "stem": "Which multicast address is used for AllSPFRouters in OSPFv2?", "options": ["224.0.0.5", "224.0.0.6", "239.255.255.250", "255.255.255.255"], "correct": [0], "explanation": "224.0.0.5 identifies all OSPF routers on the link; .6 targets designated routers.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q152", "domain": 2, "topic": "OSPF", "level": "Concept", "stem": "Which two link settings must normally agree for a working OSPFv2 adjacency?", "options": ["Area ID", "Hello and dead intervals", "Local process ID", "Hostname", "Console password"], "correct": [0, 1], "explanation": "Area and timers are compatibility checks. Other checks include authentication and relevant network parameters.", "source": "ospf", "cli": null, "type": "multi", "pairs": null, "objectives": "3.4"}, {"id": "q153", "domain": 2, "topic": "OSPF", "level": "Troubleshooting", "stem": "R1 uses hello/dead 10/40 and R2 uses 5/20 on one Ethernet segment. What is the direct issue?", "options": ["OSPF timer mismatch", "Incorrect DNS search domain", "Equal router priorities", "Different local process IDs"], "correct": [0], "explanation": "Neighbors reject incompatible hello timing; configure matching timers and verify again.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q154", "domain": 2, "topic": "OSPF", "level": "Interpretation", "stem": "What does FULL/DR describe in show ip ospf neighbor?", "options": ["A fully adjacent neighbor that is the DR", "The local router must be DR", "The neighbor has no database", "The interface is down"], "correct": [0], "explanation": "The suffix reports the neighbor's role, while FULL reports database synchronization status.", "source": "neighbor", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q155", "domain": 2, "topic": "OSPF", "level": "Concept", "stem": "Two DROTHER routers on a healthy broadcast segment remain 2-WAY with each other. Is that necessarily a fault?", "options": ["No; they normally form full adjacencies with the DR and BDR", "Yes; every pair must always be FULL", "Yes; OSPF cannot use Ethernet", "No; they are not discovering each other"], "correct": [0], "explanation": "DROTHER-to-DROTHER 2-WAY is expected in the broadcast adjacency model.", "source": "neighbor", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q156", "domain": 2, "topic": "OSPF", "level": "Troubleshooting", "stem": "Neighbors remain in EXSTART/EXCHANGE. Which mismatch is a classic candidate to inspect?", "options": ["Interface MTU", "DNS suffix", "Console baud rate", "NTP timezone"], "correct": [0], "explanation": "Database description exchange can fail with an MTU mismatch. The state suggests a check, not an exclusive diagnosis.", "source": "neighbor", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q157", "domain": 2, "topic": "OSPF", "level": "Concept", "stem": "What does passive-interface do for an OSPF-enabled LAN?", "options": ["Suppress neighbor formation while permitting advertisement of the connected prefix", "Remove every route from the LAN", "Make the LAN a different OSPF area", "Force DR priority 255"], "correct": [0], "explanation": "A passive interface does not exchange OSPF hellos but its network can still be included in OSPF advertisements.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q158", "domain": 2, "topic": "OSPF", "level": "Troubleshooting", "stem": "No OSPF hellos leave a correctly addressed link to another router. It is configured passive. What change is needed?", "options": ["Remove passive status on that adjacency-facing interface", "Increase the DNS TTL", "Disable IPv4", "Change the hostname"], "correct": [0], "explanation": "Passive operation intentionally prevents neighbor formation. Keep passive status on endpoint-only LANs where appropriate.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q159", "domain": 2, "topic": "OSPF", "level": "Foundation", "stem": "What determines OSPF interface cost by default on Cisco IOS?", "options": ["Reference bandwidth divided by interface bandwidth, with a minimum cost of 1", "Only physical distance", "Only the neighbor's router ID", "Only administrative distance"], "correct": [0], "explanation": "Cost models bandwidth rather than delay or hop count; manual cost configuration can override the calculation.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q160", "domain": 2, "topic": "OSPF", "level": "Concept", "stem": "Why adjust OSPF reference bandwidth in a high-speed network?", "options": ["To distinguish link speeds that otherwise all have cost 1", "To increase actual interface speed", "To change IP protocol 89", "To replace all static routes"], "correct": [0], "explanation": "A low reference bandwidth collapses multiple high-speed links to the minimum cost. Use consistent planning across routers.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q161", "domain": 2, "topic": "OSPF", "level": "Foundation", "stem": "Is a DR elected on an OSPF point-to-point network type?", "options": ["No", "Yes, one per IP address", "Only if the link has /30", "Only if DNS fails"], "correct": [0], "explanation": "Point-to-point OSPF does not require the broadcast segment DR/BDR model.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q162", "domain": 2, "topic": "OSPF", "level": "Concept", "stem": "At a fresh broadcast election, which criterion is compared before router ID?", "options": ["Interface OSPF priority", "Lowest MAC address", "Lowest route metric", "Highest subnet mask"], "correct": [0], "explanation": "The highest eligible priority wins; router ID breaks a priority tie.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q163", "domain": 2, "topic": "OSPF", "level": "Foundation", "stem": "What does ip ospf priority 0 do on a broadcast interface?", "options": ["Makes it ineligible to become DR or BDR", "Disables all OSPF packets", "Forces it to become DR", "Sets route cost to zero"], "correct": [0], "explanation": "Priority zero excludes the router from DR/BDR election on that interface while allowing neighbor participation.", "source": "neighbor", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q164", "domain": 2, "topic": "OSPF", "level": "Concept", "stem": "A higher-priority router joins a stable broadcast segment with a DR. Does it automatically replace that DR?", "options": ["No; the election is normally nonpreemptive", "Yes, immediately", "Only if its hostname is shorter", "Only if it has a static route"], "correct": [0], "explanation": "An existing functioning DR is not displaced merely by a new higher-priority participant.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q165", "domain": 2, "topic": "OSPF", "level": "Interpretation", "stem": "Which command is most direct for checking current OSPF adjacency states?", "options": ["show ip ospf neighbor", "show vlan brief", "show ip dhcp binding", "show interfaces trunk"], "correct": [0], "explanation": "Neighbor output reports IDs, states and associated interfaces; routing output alone does not show every adjacency detail.", "source": "neighbor", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q166", "domain": 2, "topic": "FHRP", "level": "Foundation", "stem": "What problem do first-hop redundancy protocols address?", "options": ["Failure of a host's default gateway device", "Exhaustion of all DNS names", "Loss of every Internet path", "Encryption of wireless beacons"], "correct": [0], "explanation": "A shared virtual gateway can remain available through another router when one gateway fails.", "source": "fhrp", "cli": null, "type": "single", "pairs": null, "objectives": "3.5"}, {"id": "q167", "domain": 2, "topic": "FHRP", "level": "Concept", "stem": "Which address should a host normally use with HSRP gateway redundancy?", "options": ["The HSRP virtual IP address", "Only the standby router's physical IP", "The broadcast address", "The OSPF router ID"], "correct": [0], "explanation": "Using the virtual address allows gateway ownership to move without reconfiguring each host.", "source": "fhrp", "cli": null, "type": "single", "pairs": null, "objectives": "3.5"}, {"id": "q168", "domain": 2, "topic": "FHRP", "level": "Foundation", "stem": "Which roles does an HSRP group use?", "options": ["Active and standby", "DR and BDR", "Root and alternate", "Primary and authoritative DNS"], "correct": [0], "explanation": "The active router forwards for the virtual gateway; standby is ready to take over.", "source": "fhrp", "cli": null, "type": "single", "pairs": null, "objectives": "3.5"}, {"id": "q169", "domain": 2, "topic": "FHRP", "level": "Concept", "stem": "Does FHRP by itself create routes to all remote networks?", "options": ["No; each gateway still needs appropriate routing", "Yes; it replaces routing protocols", "Only if the virtual IP is public", "Only for IPv6"], "correct": [0], "explanation": "Gateway redundancy preserves the first hop. Upstream connectivity and route availability must also be designed.", "source": "fhrp", "cli": null, "type": "single", "pairs": null, "objectives": "3.5"}, {"id": "q170", "domain": 2, "topic": "Routing decisions", "level": "Troubleshooting", "stem": "Traceroute stops after the first hop. Which conclusion is justified?", "options": ["Further investigation is needed; filtering or a path problem could explain it", "The second router is definitely powered off", "The destination is definitely down", "DNS is definitely broken"], "correct": [0], "explanation": "Missing ICMP responses do not uniquely locate a failure; some devices filter or rate-limit traceroute responses.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q171", "domain": 2, "topic": "Routing decisions", "level": "Interpretation", "stem": "What does the asterisk in S* usually indicate?", "options": ["A candidate default route", "An unusable route", "A manually encrypted route", "A route learned from STP"], "correct": [0], "explanation": "The code S identifies static and the asterisk marks candidate-default status.", "source": "route", "cli": "S* 0.0.0.0/0 [1/0] via 192.0.2.1", "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q172", "domain": 2, "topic": "Static routing", "level": "Concept", "stem": "Why specify both exit interface and next hop for an Ethernet static route when appropriate?", "options": ["It identifies both the egress link and the adjacent next hop", "It guarantees Internet reachability", "It disables ARP", "It creates a routing protocol adjacency"], "correct": [0], "explanation": "A fully specified route avoids treating every remote destination as directly attached on a multiaccess link.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "3.3"}, {"id": "q173", "domain": 2, "topic": "OSPF", "level": "Interpretation", "stem": "What is this command doing?", "options": ["Enabling OSPF process 1 in area 0 on this interface", "Setting router ID to 1.0.0.0", "Making the interface passive", "Setting the cost to 1"], "correct": [0], "explanation": "Interface-level OSPF activation selects the process and area without needing a matching network statement.", "source": "ospf", "cli": "interface GigabitEthernet0/0\n ip ospf 1 area 0", "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q174", "domain": 3, "topic": "NAT & PAT", "level": "Foundation", "stem": "What is inside source NAT used to change?", "options": ["Source addressing of traffic from the inside network", "Only the Ethernet preamble", "Only OSPF router IDs", "Only DNS TTLs"], "correct": [0], "explanation": "Inside source translation maps inside addresses to the addresses used toward the outside.", "source": "nat", "cli": null, "type": "single", "pairs": null, "objectives": "4.1"}, {"id": "q175", "domain": 3, "topic": "NAT & PAT", "level": "Foundation", "stem": "Which term describes an inside host's address as used on its local network?", "options": ["Inside local", "Inside global", "Outside global", "Outside local"], "correct": [0], "explanation": "Inside local identifies the internal address before inside-source translation.", "source": "nat", "cli": null, "type": "single", "pairs": null, "objectives": "4.1"}, {"id": "q176", "domain": 3, "topic": "NAT & PAT", "level": "Concept", "stem": "What distinguishes static NAT from ordinary dynamic pool NAT?", "options": ["Static NAT provides a configured fixed address mapping", "Static NAT requires every session to use one port", "Dynamic NAT never changes addresses", "Static NAT is a routing protocol"], "correct": [0], "explanation": "Static NAT maps a specific inside local address to a specific inside global address; pool allocation is dynamic.", "source": "nat", "cli": null, "type": "single", "pairs": null, "objectives": "4.1"}, {"id": "q177", "domain": 3, "topic": "NAT & PAT", "level": "Concept", "stem": "Why does PAT allow many inside hosts to share one global IPv4 address?", "options": ["It distinguishes translations using transport identifiers such as ports", "It assigns the same MAC to every host", "It disables TCP", "It converts all traffic to broadcast"], "correct": [0], "explanation": "Address-and-port translation separates flows sharing one global address.", "source": "nat", "cli": null, "type": "single", "pairs": null, "objectives": "4.1"}, {"id": "q178", "domain": 3, "topic": "NAT & PAT", "level": "Interpretation", "stem": "What is the inside global address here?", "options": ["203.0.113.5", "10.1.1.10", "198.51.100.20", "192.0.2.1"], "correct": [0], "explanation": "The inside global column shows the translated address visible toward the outside.", "source": "nat", "cli": "Pro Inside global       Inside local      Outside local       Outside global\ntcp 203.0.113.5:40001    10.1.1.10:51500    198.51.100.20:443   198.51.100.20:443", "type": "single", "pairs": null, "objectives": "4.1"}, {"id": "q179", "domain": 3, "topic": "NAT & PAT", "level": "Interpretation", "stem": "What does overload add to this configuration?", "options": ["PAT using the interface address", "Static one-to-one NAT only", "A DHCP scope", "An OSPF default route"], "correct": [0], "explanation": "The overload keyword permits multiple translations to share the selected inside global address through ports.", "source": "nat", "cli": "ip nat inside source list 10 interface GigabitEthernet0/1 overload", "type": "single", "pairs": null, "objectives": "4.1"}, {"id": "q180", "domain": 3, "topic": "NAT & PAT", "level": "Troubleshooting", "stem": "A pool has five addresses and uses dynamic NAT without overload. A sixth simultaneous inside host cannot get a mapping. Why?", "options": ["The translation pool may be exhausted", "OSPF permits only five hosts", "NAT always requires IPv6", "DNS cannot resolve six names"], "correct": [0], "explanation": "Without overload, ordinary dynamic address translations consume distinct global addresses.", "source": "nat", "cli": null, "type": "single", "pairs": null, "objectives": "4.1"}, {"id": "q181", "domain": 3, "topic": "NAT & PAT", "level": "Troubleshooting", "stem": "A router has a valid NAT rule but no translations after traffic. Which two items should you inspect?", "options": ["Inside/outside interface designation", "Whether traffic matches the NAT selection ACL", "STP root MAC", "Console terminal width", "AP SSID length"], "correct": [0, 1], "explanation": "NAT requires correct interface roles and a matching rule. Routing and the actual traffic path also matter.", "source": "nat", "cli": null, "type": "multi", "pairs": null, "objectives": "4.1"}, {"id": "q182", "domain": 3, "topic": "NAT & PAT", "level": "Interpretation", "stem": "Which command shows current NAT mappings?", "options": ["show ip nat translations", "show ip ospf database", "show vlan", "show ntp status"], "correct": [0], "explanation": "Translations show active address and, for PAT, port mappings.", "source": "nat", "cli": null, "type": "single", "pairs": null, "objectives": "4.1"}, {"id": "q183", "domain": 3, "topic": "DHCP & DNS", "level": "Foundation", "stem": "Which order describes initial DHCPv4 address acquisition?", "options": ["Discover, Offer, Request, Acknowledge", "Offer, Discover, Acknowledge, Request", "Request, Discover, Offer, Release", "Acknowledge, Offer, Discover, Request"], "correct": [0], "explanation": "The client discovers servers, receives an offer, requests a lease and receives acknowledgment.", "source": "dhcp", "cli": null, "type": "single", "pairs": null, "objectives": "4.3, 4.6"}, {"id": "q184", "domain": 3, "topic": "DHCP & DNS", "level": "Foundation", "stem": "Which UDP ports are used by DHCPv4 server and client?", "options": ["Server 67 and client 68", "Server 68 and client 67", "Both 53", "Both 123"], "correct": [0], "explanation": "DHCPv4 uses UDP 67 on the server and UDP 68 on the client.", "source": "dhcp", "cli": null, "type": "single", "pairs": null, "objectives": "4.3, 4.6"}, {"id": "q185", "domain": 3, "topic": "DHCP & DNS", "level": "Concept", "stem": "Why is DHCP relay needed for a server on another subnet?", "options": ["Initial client broadcasts are not normally routed", "DHCP cannot use any IP packets", "All clients must be directly cabled to the server", "DNS blocks offers"], "correct": [0], "explanation": "The relay conveys requests to a remote server and supplies subnet context for address selection.", "source": "relay", "cli": null, "type": "single", "pairs": null, "objectives": "4.3, 4.6"}, {"id": "q186", "domain": 3, "topic": "DHCP & DNS", "level": "Interpretation", "stem": "Where is ip helper-address typically configured for client DHCP broadcasts?", "options": ["On the Layer 3 interface facing the clients", "Only on the DNS server", "Only on a Layer 2 access port", "On every remote Internet router"], "correct": [0], "explanation": "The relay must receive the local client broadcast to forward it toward the DHCP server.", "source": "relay", "cli": null, "type": "single", "pairs": null, "objectives": "4.3, 4.6"}, {"id": "q187", "domain": 3, "topic": "DHCP & DNS", "level": "Interpretation", "stem": "Which interface command makes a Cisco router obtain an IPv4 address by DHCP?", "options": ["ip address dhcp", "ip dhcp server", "ip helper-address dhcp", "dhcp discover enable"], "correct": [0], "explanation": "ip address dhcp configures that interface as a DHCP client.", "source": "dhcp", "cli": null, "type": "single", "pairs": null, "objectives": "4.3, 4.6"}, {"id": "q188", "domain": 3, "topic": "DHCP & DNS", "level": "Troubleshooting", "stem": "Clients can reach their gateway, but new leases fail after the DHCP server moves to another subnet. What should you verify?", "options": ["DHCP relay target and reachability to the server", "The OSPF process ID on clients", "STP priority on the DNS server", "The console login banner"], "correct": [0], "explanation": "A correct relay path must reach the server and permit the return traffic.", "source": "relay", "cli": null, "type": "single", "pairs": null, "objectives": "4.3, 4.6"}, {"id": "q189", "domain": 3, "topic": "DHCP & DNS", "level": "Foundation", "stem": "What is DNS primarily used for?", "options": ["Resolving names to resource records such as IP addresses", "Assigning switch ports to VLANs", "Calculating OSPF paths", "Providing electrical power"], "correct": [0], "explanation": "DNS maps names to records. Address assignment is typically DHCP's role.", "source": "dns", "cli": null, "type": "single", "pairs": null, "objectives": "4.3, 4.6"}, {"id": "q190", "domain": 3, "topic": "DHCP & DNS", "level": "Troubleshooting", "stem": "A website works by IP but fails by hostname. What is a strong next check?", "options": ["DNS resolution and configured DNS servers", "Replace every switch cable", "Change the OSPF area", "Disable TCP"], "correct": [0], "explanation": "IP reachability with name-only failure points toward name resolution, though application hosting behavior can also matter.", "source": "dns", "cli": null, "type": "single", "pairs": null, "objectives": "4.3, 4.6"}, {"id": "q191", "domain": 3, "topic": "DHCP & DNS", "level": "Foundation", "stem": "Which DNS record maps a hostname to an IPv6 address?", "options": ["AAAA", "A", "MX", "PTR"], "correct": [0], "explanation": "AAAA records hold IPv6 addresses; A records hold IPv4 addresses.", "source": "dns", "cli": null, "type": "single", "pairs": null, "objectives": "4.3, 4.6"}, {"id": "q192", "domain": 3, "topic": "DHCP & DNS", "level": "Concept", "stem": "Does DNS use only UDP?", "options": ["No; DNS can use both UDP and TCP", "Yes; TCP is never used", "No; it uses only ICMP", "No; it uses only OSPF"], "correct": [0], "explanation": "DNS commonly uses UDP for queries but also uses TCP, including for situations requiring reliable larger transfers.", "source": "dns", "cli": null, "type": "single", "pairs": null, "objectives": "4.3, 4.6"}, {"id": "q193", "domain": 3, "topic": "NTP & monitoring", "level": "Foundation", "stem": "What does NTP synchronize?", "options": ["Device clocks", "VLAN databases", "MAC addresses", "TCP port assignments"], "correct": [0], "explanation": "Consistent time supports log correlation and other operations that depend on timestamps.", "source": "ntp", "cli": null, "type": "single", "pairs": null, "objectives": "4.2, 4.4–4.5"}, {"id": "q194", "domain": 3, "topic": "NTP & monitoring", "level": "Interpretation", "stem": "Which command makes this device an NTP client of 192.0.2.10?", "options": ["ntp server 192.0.2.10", "ntp master 192.0.2.10", "clock timezone 192.0.2.10", "ip helper-address 192.0.2.10"], "correct": [0], "explanation": "The ntp server command specifies an upstream time source.", "source": "ntp", "cli": null, "type": "single", "pairs": null, "objectives": "4.2, 4.4–4.5"}, {"id": "q195", "domain": 3, "topic": "NTP & monitoring", "level": "Concept", "stem": "A client synchronizes to a stratum-2 server. What stratum does the client normally advertise?", "options": ["3", "1", "2", "0"], "correct": [0], "explanation": "NTP stratum increases by one at each synchronization level away from the reference clock.", "source": "ntp", "cli": null, "type": "single", "pairs": null, "objectives": "4.2, 4.4–4.5"}, {"id": "q196", "domain": 3, "topic": "NTP & monitoring", "level": "Interpretation", "stem": "What does the leading asterisk usually mark in show ntp associations?", "options": ["The selected synchronization peer", "A failed DNS record", "A static NAT entry", "A blocked switch port"], "correct": [0], "explanation": "The association marker identifies the peer currently selected for synchronization.", "source": "ntp", "cli": null, "type": "single", "pairs": null, "objectives": "4.2, 4.4–4.5"}, {"id": "q197", "domain": 3, "topic": "NTP & monitoring", "level": "Foundation", "stem": "What is the role of an SNMP manager?", "options": ["Collect and manage information from agents", "Repeat electrical signals", "Assign MAC addresses to interfaces", "Perform every packet forwarding lookup"], "correct": [0], "explanation": "Management software polls or receives notifications from SNMP agents on managed devices.", "source": "snmp", "cli": null, "type": "single", "pairs": null, "objectives": "4.2, 4.4–4.5"}, {"id": "q198", "domain": 3, "topic": "NTP & monitoring", "level": "Foundation", "stem": "What is an SNMP trap?", "options": ["An agent-initiated event notification", "A guaranteed reliable file transfer", "A DHCP offer", "A VLAN encapsulation header"], "correct": [0], "explanation": "Traps notify the manager of events without waiting for a polling request; traditional traps are unacknowledged.", "source": "snmp", "cli": null, "type": "single", "pairs": null, "objectives": "4.2, 4.4–4.5"}, {"id": "q199", "domain": 3, "topic": "NTP & monitoring", "level": "Concept", "stem": "Which SNMPv3 security level provides authentication and encryption?", "options": ["authPriv", "authNoPriv", "noAuthNoPriv", "public community"], "correct": [0], "explanation": "authPriv combines authentication and privacy. Merely selecting SNMPv3 does not guarantee encryption without the security level.", "source": "snmp", "cli": null, "type": "single", "pairs": null, "objectives": "4.2, 4.4–4.5"}, {"id": "q200", "domain": 3, "topic": "NTP & monitoring", "level": "Interpretation", "stem": "What is the severity number in this syslog message?", "options": ["3", "0", "5", "7"], "correct": [0], "explanation": "The numeric field after the facility is severity. Here LINK is the facility and UPDOWN is the mnemonic.", "source": "log", "cli": "%LINK-3-UPDOWN: Interface GigabitEthernet0/1, changed state to down", "type": "single", "pairs": null, "objectives": "4.2, 4.4–4.5"}, {"id": "q201", "domain": 3, "topic": "NTP & monitoring", "level": "Foundation", "stem": "Which syslog level is most severe?", "options": ["0, emergencies", "7, debugging", "6, informational", "5, notifications"], "correct": [0], "explanation": "Syslog severity increases in importance as the number decreases toward zero.", "source": "log", "cli": null, "type": "single", "pairs": null, "objectives": "4.2, 4.4–4.5"}, {"id": "q202", "domain": 3, "topic": "NTP & monitoring", "level": "Interpretation", "stem": "With logging trap warnings, which severity numbers are sent to the syslog server?", "options": ["0 through 4", "Only 4", "4 through 7", "Only 7"], "correct": [0], "explanation": "A threshold of warnings (4) includes that level and all more-severe, lower-numbered levels.", "source": "log", "cli": null, "type": "single", "pairs": null, "objectives": "4.2, 4.4–4.5"}, {"id": "q203", "domain": 3, "topic": "NTP & monitoring", "level": "Troubleshooting", "stem": "Logs from two routers describe the same event several minutes apart. Which service should you verify?", "options": ["NTP synchronization", "LLDP only", "DHCP snooping only", "PAT overload only"], "correct": [0], "explanation": "Unsynchronized clocks make cross-device timelines unreliable.", "source": "ntp", "cli": null, "type": "single", "pairs": null, "objectives": "4.2, 4.4–4.5"}, {"id": "q204", "domain": 3, "topic": "QoS", "level": "Foundation", "stem": "What does QoS classification do?", "options": ["Identify traffic categories for treatment", "Physically increase cable bandwidth", "Replace all application headers", "Make packet loss impossible"], "correct": [0], "explanation": "Classification groups traffic according to fields or application information so a policy can act on it.", "source": "qos", "cli": null, "type": "single", "pairs": null, "objectives": "4.7"}, {"id": "q205", "domain": 3, "topic": "QoS", "level": "Foundation", "stem": "What does QoS marking do?", "options": ["Set a field such as DSCP to signal treatment", "Change the optical wavelength", "Elect a DR", "Allocate a private address"], "correct": [0], "explanation": "Marking carries a classification indication that downstream policies may use.", "source": "qos", "cli": null, "type": "single", "pairs": null, "objectives": "4.7"}, {"id": "q206", "domain": 3, "topic": "QoS", "level": "Concept", "stem": "What is a typical difference between shaping and policing?", "options": ["Shaping buffers excess traffic; policing can drop or remark it", "Policing always adds bandwidth", "Shaping never delays packets", "Both are routing protocols"], "correct": [0], "explanation": "Shaping smooths transmission by queueing. Policing enforces a rate with configured actions on excess traffic.", "source": "qos", "cli": null, "type": "single", "pairs": null, "objectives": "4.7"}, {"id": "q207", "domain": 3, "topic": "QoS", "level": "Concept", "stem": "Why give voice preferential queue treatment under congestion?", "options": ["Voice is sensitive to delay and jitter", "Voice can tolerate unlimited delay", "Voice must always use TCP", "Voice cannot be marked"], "correct": [0], "explanation": "Queue scheduling can reduce waiting for latency-sensitive packets, within available capacity.", "source": "qos", "cli": null, "type": "single", "pairs": null, "objectives": "4.7"}, {"id": "q208", "domain": 3, "topic": "QoS", "level": "Concept", "stem": "What is congestion in an output queue context?", "options": ["Traffic arrives faster than the egress can transmit for a period", "An interface has no IP address", "An AP changes its hostname", "A router's clock is incorrect"], "correct": [0], "explanation": "Packets accumulate when demand exceeds service rate; sustained excess can cause drops.", "source": "qos", "cli": null, "type": "single", "pairs": null, "objectives": "4.7"}, {"id": "q209", "domain": 3, "topic": "SSH & file transfer", "level": "Foundation", "stem": "What is the usual TCP port for SSH?", "options": ["22", "23", "69", "161"], "correct": [0], "explanation": "SSH normally uses TCP 22. Telnet uses 23, while TFTP and SNMP commonly use UDP ports.", "source": "ssh", "cli": null, "type": "single", "pairs": null, "objectives": "4.8–4.9"}, {"id": "q210", "domain": 3, "topic": "SSH & file transfer", "level": "Interpretation", "stem": "Which VTY command restricts incoming remote CLI transport to SSH?", "options": ["transport input ssh", "login local only", "service password-encryption", "ip ssh time-out 60"], "correct": [0], "explanation": "transport input controls allowed protocols. Authentication settings are also required.", "source": "ssh", "cli": null, "type": "single", "pairs": null, "objectives": "4.8–4.9"}, {"id": "q211", "domain": 3, "topic": "SSH & file transfer", "level": "Foundation", "stem": "Which file-transfer protocol uses UDP and has no built-in user authentication?", "options": ["TFTP", "FTP", "SCP", "SFTP"], "correct": [0], "explanation": "TFTP is a minimal transfer protocol. Its simplicity comes without built-in authentication or encryption.", "source": "ftp", "cli": null, "type": "single", "pairs": null, "objectives": "4.8–4.9"}, {"id": "q212", "domain": 3, "topic": "SSH & file transfer", "level": "Concept", "stem": "How does conventional FTP differ from TFTP?", "options": ["FTP uses TCP and separate control/data connections", "FTP uses only broadcasts", "TFTP always encrypts files", "FTP is a routing protocol"], "correct": [0], "explanation": "FTP has a TCP control channel and data channel; ordinary FTP is not automatically encrypted.", "source": "ftp", "cli": null, "type": "single", "pairs": null, "objectives": "4.8–4.9"}, {"id": "q213", "domain": 3, "topic": "SSH & file transfer", "level": "Troubleshooting", "stem": "SSH reaches a router but login fails. What should be inspected after transport connectivity is confirmed?", "options": ["Configured user authentication and VTY login method", "Only the Ethernet preamble", "Only the DNS TTL", "Only the STP root"], "correct": [0], "explanation": "An established connection and successful user authentication are separate steps.", "source": "ssh", "cli": null, "type": "single", "pairs": null, "objectives": "4.8–4.9"}, {"id": "q214", "domain": 4, "topic": "Security principles", "level": "Foundation", "stem": "Which security property prevents unauthorized disclosure of information?", "options": ["Confidentiality", "Availability", "Integrity", "Load balancing"], "correct": [0], "explanation": "Confidentiality limits exposure; integrity protects correctness and availability concerns access to services.", "source": "security", "cli": null, "type": "single", "pairs": null, "objectives": "5.1–5.2"}, {"id": "q215", "domain": 4, "topic": "Security principles", "level": "Foundation", "stem": "Which property is primarily affected by unauthorized alteration of configuration?", "options": ["Integrity", "Availability only", "Physical speed", "RF coverage"], "correct": [0], "explanation": "Tampering changes the correctness or trustworthiness of data or configuration.", "source": "security", "cli": null, "type": "single", "pairs": null, "objectives": "5.1–5.2"}, {"id": "q216", "domain": 4, "topic": "Security principles", "level": "Concept", "stem": "A flood exhausts a server and stops legitimate access. Which property is directly affected?", "options": ["Availability", "Confidentiality only", "IP address uniqueness", "NTP precision only"], "correct": [0], "explanation": "A denial-of-service condition prevents authorized users from obtaining service.", "source": "security", "cli": null, "type": "single", "pairs": null, "objectives": "5.1–5.2"}, {"id": "q217", "domain": 4, "topic": "Security principles", "level": "Foundation", "stem": "What is a vulnerability?", "options": ["A weakness that could be exploited", "Any security policy", "A successful backup", "A guaranteed attack"], "correct": [0], "explanation": "A vulnerability is the exploitable weakness; a threat is a potential cause of harm.", "source": "security", "cli": null, "type": "single", "pairs": null, "objectives": "5.1–5.2"}, {"id": "q218", "domain": 4, "topic": "Security principles", "level": "Concept", "stem": "Which is an example of social engineering?", "options": ["Impersonating IT support to solicit a password", "A failed fiber transceiver", "A normal DHCP renewal", "An OSPF route update"], "correct": [0], "explanation": "Social engineering manipulates people rather than relying solely on a technical exploit.", "source": "security", "cli": null, "type": "single", "pairs": null, "objectives": "5.1–5.2"}, {"id": "q219", "domain": 4, "topic": "Security principles", "level": "Concept", "stem": "Which two controls can reduce user credential risk?", "options": ["Multi-factor authentication", "User security awareness training", "Shared administrator passwords", "Disabling audit records", "Publishing recovery codes"], "correct": [0, 1], "explanation": "MFA reduces reliance on one factor, while training helps users recognize deceptive requests.", "source": "security", "cli": null, "type": "multi", "pairs": null, "objectives": "5.1–5.2"}, {"id": "q220", "domain": 4, "topic": "Security principles", "level": "Foundation", "stem": "Which two actions follow least privilege?", "options": ["Grant a role only the permissions it needs", "Remove access that is no longer required", "Give every user administrator rights", "Share one privileged account across all staff", "Disable auditing to reduce overhead"], "correct": [0, 1], "explanation": "Least privilege limits permissions to current needs, reducing the impact of misuse or a compromised account.", "source": "security", "cli": null, "type": "multi", "pairs": null, "objectives": "5.1–5.2"}, {"id": "q221", "domain": 4, "topic": "Security principles", "level": "Concept", "stem": "Which is a physical security control?", "options": ["Restricted access to network equipment rooms", "OSPF cost tuning", "DNS TTL reduction", "TCP window scaling"], "correct": [0], "explanation": "Locks and controlled entry protect physical infrastructure; logical controls address other layers.", "source": "security", "cli": null, "type": "single", "pairs": null, "objectives": "5.1–5.2"}, {"id": "q222", "domain": 4, "topic": "AAA & device access", "level": "Foundation", "stem": "Which AAA function verifies who a user is?", "options": ["Authentication", "Authorization", "Accounting", "Aggregation"], "correct": [0], "explanation": "Authentication checks identity; authorization determines allowed actions and accounting records activity.", "source": "aaa", "cli": null, "type": "single", "pairs": null, "objectives": "5.3–5.4, 5.8"}, {"id": "q223", "domain": 4, "topic": "AAA & device access", "level": "Foundation", "stem": "Which AAA function decides whether a user can run a privileged command?", "options": ["Authorization", "Authentication only", "Accounting only", "Address translation"], "correct": [0], "explanation": "Permissions are an authorization decision after or alongside identity verification.", "source": "aaa", "cli": null, "type": "single", "pairs": null, "objectives": "5.3–5.4, 5.8"}, {"id": "q224", "domain": 4, "topic": "AAA & device access", "level": "Foundation", "stem": "Which AAA function records session actions for auditing?", "options": ["Accounting", "Authentication", "ARP", "Anycast"], "correct": [0], "explanation": "Accounting provides records such as session times or command activity, depending on configuration.", "source": "aaa", "cli": null, "type": "single", "pairs": null, "objectives": "5.3–5.4, 5.8"}, {"id": "q225", "domain": 4, "topic": "AAA & device access", "level": "Concept", "stem": "Which protocol is commonly used for granular device-administration AAA and uses TCP 49?", "options": ["TACACS+", "RADIUS", "SNMP", "NTP"], "correct": [0], "explanation": "TACACS+ commonly supports separate authentication, authorization and accounting services for device administration.", "source": "aaa", "cli": null, "type": "single", "pairs": null, "objectives": "5.3–5.4, 5.8"}, {"id": "q226", "domain": 4, "topic": "AAA & device access", "level": "Concept", "stem": "Which protocol is commonly used for 802.1X backend authentication?", "options": ["RADIUS", "TFTP", "CDP", "HSRP"], "correct": [0], "explanation": "A switch or wireless authenticator commonly exchanges AAA messages with a RADIUS server.", "source": "aaa", "cli": null, "type": "single", "pairs": null, "objectives": "5.3–5.4, 5.8"}, {"id": "q227", "domain": 4, "topic": "AAA & device access", "level": "Concept", "stem": "Why is enable secret preferred over legacy enable password?", "options": ["It stores a one-way password representation using the supported secret algorithm", "It eliminates the need for AAA", "It encrypts every network packet", "It prevents physical console access"], "correct": [0], "explanation": "Secrets avoid legacy cleartext-style password storage; supported algorithms vary by software version.", "source": "hardening", "cli": null, "type": "single", "pairs": null, "objectives": "5.3–5.4, 5.8"}, {"id": "q228", "domain": 4, "topic": "AAA & device access", "level": "Concept", "stem": "Does service password-encryption provide strong protection for legacy Type 7 passwords?", "options": ["No; Type 7 is reversible obfuscation", "Yes; it is equivalent to modern password hashing", "Yes; it encrypts all SSH keys", "It prevents password guessing entirely"], "correct": [0], "explanation": "Type 7 is easily reversible and should not be treated as strong cryptographic password storage.", "source": "hardening", "cli": null, "type": "single", "pairs": null, "objectives": "5.3–5.4, 5.8"}, {"id": "q229", "domain": 4, "topic": "AAA & device access", "level": "Interpretation", "stem": "What does login local on VTY lines select?", "options": ["The local username database for login authentication", "Only the enable password for every user", "No authentication", "Only a RADIUS server"], "correct": [0], "explanation": "Local user credentials are checked. SSH transport settings and keys are separate prerequisites.", "source": "hardening", "cli": null, "type": "single", "pairs": null, "objectives": "5.3–5.4, 5.8"}, {"id": "q230", "domain": 4, "topic": "ACLs", "level": "Foundation", "stem": "What does a standard IPv4 ACL primarily match?", "options": ["Source IPv4 address", "Destination TCP port only", "Both source and destination ports", "Only Ethernet source MAC"], "correct": [0], "explanation": "Standard ACLs match source addresses; extended ACLs can express more detailed packet criteria.", "source": "acl", "cli": null, "type": "single", "pairs": null, "objectives": "5.6"}, {"id": "q231", "domain": 4, "topic": "ACLs", "level": "Foundation", "stem": "Which two fields can an extended IPv4 ACL examine?", "options": ["Destination IPv4 address", "TCP destination port", "Cable category", "Fan speed", "Console font"], "correct": [0, 1], "explanation": "Extended ACLs can match protocol and IP addresses and, where appropriate, transport ports.", "source": "acl", "cli": null, "type": "multi", "pairs": null, "objectives": "5.6"}, {"id": "q232", "domain": 4, "topic": "ACLs", "level": "Concept", "stem": "What happens when a packet matches an ACL entry?", "options": ["That entry's action is used and evaluation stops", "Every later rule also overrides it", "The router sorts rules by prefix length first", "The packet is always logged"], "correct": [0], "explanation": "ACLs are processed in order; the first matching entry decides the action.", "source": "acl", "cli": null, "type": "single", "pairs": null, "objectives": "5.6"}, {"id": "q233", "domain": 4, "topic": "ACLs", "level": "Foundation", "stem": "What happens to unmatched traffic at the end of an ordinary IPv4 interface ACL?", "options": ["It is denied by the implicit deny", "It is always permitted", "It is forwarded by DNS", "It changes VLANs"], "correct": [0], "explanation": "A permit must match for traffic to pass an applied filtering ACL.", "source": "acl", "cli": null, "type": "single", "pairs": null, "objectives": "5.6"}, {"id": "q234", "domain": 4, "topic": "ACLs", "level": "Concept", "stem": "Where are extended ACLs generally placed when practical?", "options": ["Near the traffic source", "Always only beside the destination", "Only on loopbacks", "Only on the Internet router"], "correct": [0], "explanation": "Filtering unwanted traffic near its source avoids carrying it unnecessarily. Actual placement depends on the policy and topology.", "source": "acl", "cli": null, "type": "single", "pairs": null, "objectives": "5.6"}, {"id": "q235", "domain": 4, "topic": "ACLs", "level": "Concept", "stem": "Why are standard ACLs often placed near the destination?", "options": ["They cannot distinguish destinations and could block too broadly near the source", "They require a destination port", "They cannot operate inbound", "They are wireless-only"], "correct": [0], "explanation": "Source-only matching can affect unrelated destinations if placed too early in the path.", "source": "acl", "cli": null, "type": "single", "pairs": null, "objectives": "5.6"}, {"id": "q236", "domain": 4, "topic": "ACLs", "level": "Interpretation", "stem": "What does this ACL line allow?", "options": ["TCP from any source to HTTPS on 192.0.2.10", "All traffic from 192.0.2.10", "UDP DNS to every server", "Only TCP source port 443 traffic"], "correct": [0], "explanation": "The eq 443 appears after the destination, so it matches the destination port.", "source": "acl", "cli": "permit tcp any host 192.0.2.10 eq 443", "type": "single", "pairs": null, "objectives": "5.6"}, {"id": "q237", "domain": 4, "topic": "ACLs", "level": "Interpretation", "stem": "Which wildcard matches exactly one IPv4 host?", "options": ["0.0.0.0", "255.255.255.255", "0.0.0.255", "255.0.0.0"], "correct": [0], "explanation": "Zero wildcard bits must match. The host keyword is shorthand for an exact address match.", "source": "acl", "cli": null, "type": "single", "pairs": null, "objectives": "5.6"}, {"id": "q238", "domain": 4, "topic": "ACLs", "level": "Interpretation", "stem": "What is the wildcard corresponding to 255.255.255.192?", "options": ["0.0.0.63", "0.0.0.192", "0.0.0.64", "255.255.255.63"], "correct": [0], "explanation": "Invert each mask bit, equivalently subtract each octet from 255.", "source": "acl", "cli": null, "type": "single", "pairs": null, "objectives": "5.6"}, {"id": "q239", "domain": 4, "topic": "ACLs", "level": "Troubleshooting", "stem": "A deny rule is appended below permit ip any any. Why does the deny never match?", "options": ["The earlier permit already matches the packets", "Deny statements are unsupported", "The ACL must use only UDP", "The mask is always ignored"], "correct": [0], "explanation": "Rule ordering matters. A broad permit shadows later denies for matching traffic.", "source": "acl", "cli": null, "type": "single", "pairs": null, "objectives": "5.6"}, {"id": "q240", "domain": 4, "topic": "ACLs", "level": "Interpretation", "stem": "What does ip access-group FILTER in apply to?", "options": ["Packets entering that interface", "Only packets leaving that interface", "Only console input", "Only routing-table entries"], "correct": [0], "explanation": "Direction is relative to the router interface, not the user's idea of inside or outside.", "source": "acl", "cli": null, "type": "single", "pairs": null, "objectives": "5.6"}, {"id": "q241", "domain": 4, "topic": "ACLs", "level": "Troubleshooting", "stem": "A correct ACL exists but interface traffic is unaffected. What should you verify?", "options": ["That it is applied on the intended interface and direction", "That the router hostname matches the ACL name", "That every host has static DNS", "That the ACL number is the VLAN ID"], "correct": [0], "explanation": "An ACL definition does not automatically filter traffic until referenced by an appropriate feature.", "source": "acl", "cli": null, "type": "single", "pairs": null, "objectives": "5.6"}, {"id": "q242", "domain": 4, "topic": "Layer 2 security", "level": "Foundation", "stem": "What does switch port security restrict?", "options": ["Allowed source MAC addresses on a port", "Every TCP sequence number", "The number of OSPF areas", "DNS record types"], "correct": [0], "explanation": "Port security constrains source MAC use; it is not equivalent to user identity authentication.", "source": "portsec", "cli": null, "type": "single", "pairs": null, "objectives": "5.7"}, {"id": "q243", "domain": 4, "topic": "Layer 2 security", "level": "Foundation", "stem": "What is the default port-security violation action on typical Cisco access switches?", "options": ["shutdown", "protect", "restrict", "forward"], "correct": [0], "explanation": "Shutdown puts the interface into an error-disabled state after a violation.", "source": "portsec", "cli": null, "type": "single", "pairs": null, "objectives": "5.7"}, {"id": "q244", "domain": 4, "topic": "Layer 2 security", "level": "Concept", "stem": "Which violation mode drops violating traffic and increments a violation counter without shutting the port?", "options": ["restrict", "protect", "shutdown", "trunk"], "correct": [0], "explanation": "Restrict drops offending frames and provides notification/counter behavior while the port remains operational.", "source": "portsec", "cli": null, "type": "single", "pairs": null, "objectives": "5.7"}, {"id": "q245", "domain": 4, "topic": "Layer 2 security", "level": "Concept", "stem": "What does sticky MAC learning do?", "options": ["Adds learned secure MACs to running configuration", "Automatically saves every change to startup configuration", "Disables all MAC learning", "Changes endpoint MAC addresses"], "correct": [0], "explanation": "Sticky entries become configuration lines. Persistence across reboot requires saving the configuration.", "source": "portsec", "cli": null, "type": "single", "pairs": null, "objectives": "5.7"}, {"id": "q246", "domain": 4, "topic": "Layer 2 security", "level": "Troubleshooting", "stem": "A port permits one secure MAC but must support a phone and attached PC. What should you verify?", "options": ["Appropriate secure-MAC limits and voice/data design", "That both devices share an IP", "That all security is disabled globally", "That the PC is the STP root"], "correct": [0], "explanation": "Two legitimate devices can exceed a one-address policy. Set limits consistent with the intended endpoint arrangement.", "source": "portsec", "cli": null, "type": "single", "pairs": null, "objectives": "5.7"}, {"id": "q247", "domain": 4, "topic": "Layer 2 security", "level": "Foundation", "stem": "What does DHCP snooping help block?", "options": ["Rogue DHCP server messages on untrusted ports", "All HTTP traffic", "Every IPv6 router advertisement", "OSPF hello packets"], "correct": [0], "explanation": "Snooping distinguishes trusted server-facing paths from untrusted client-facing paths.", "source": "snoop", "cli": null, "type": "single", "pairs": null, "objectives": "5.7"}, {"id": "q248", "domain": 4, "topic": "Layer 2 security", "level": "Concept", "stem": "Which DHCP snooping port should normally be trusted?", "options": ["The legitimate DHCP server-facing or authorized upstream port", "Every user access port", "Every unplugged interface", "Only console ports"], "correct": [0], "explanation": "Trust is assigned where authorized server responses should arrive, not indiscriminately to endpoints.", "source": "snoop", "cli": null, "type": "single", "pairs": null, "objectives": "5.7"}, {"id": "q249", "domain": 4, "topic": "Layer 2 security", "level": "Foundation", "stem": "What does Dynamic ARP Inspection validate?", "options": ["ARP sender bindings against trusted information", "OSPF cost against bandwidth", "DNS names against SSIDs", "TCP ports against VLAN IDs"], "correct": [0], "explanation": "DAI checks ARP validity using information such as DHCP snooping bindings and configured ARP ACLs.", "source": "dai", "cli": null, "type": "single", "pairs": null, "objectives": "5.7"}, {"id": "q250", "domain": 4, "topic": "Layer 2 security", "level": "Troubleshooting", "stem": "A static-IP host is blocked by DAI because no DHCP binding exists. What is an appropriate solution to evaluate?", "options": ["A correct static binding/ARP ACL or supported policy for that host", "Disable all network security everywhere", "Change the DNS suffix", "Increase OSPF priority"], "correct": [0], "explanation": "Static hosts need legitimate validation information; the exact supported method depends on platform and policy.", "source": "dai", "cli": null, "type": "single", "pairs": null, "objectives": "5.7"}, {"id": "q251", "domain": 4, "topic": "VPN & wireless security", "level": "Foundation", "stem": "What is a site-to-site VPN commonly used for?", "options": ["Protecting traffic between networks over an untrusted transport", "Replacing every host firewall", "Assigning wireless channels", "Eliminating all routing"], "correct": [0], "explanation": "The tunnel secures intersite traffic while each site's routing and access policy remain necessary.", "source": "vpn", "cli": null, "type": "single", "pairs": null, "objectives": "5.5, 5.9–5.10"}, {"id": "q252", "domain": 4, "topic": "VPN & wireless security", "level": "Concept", "stem": "What distinguishes a remote-access VPN use case?", "options": ["An individual user's device connects securely to an organizational network", "Only two fixed branch gateways connect", "It always uses unencrypted UDP", "It replaces DNS with ARP"], "correct": [0], ity independent of some physical details.", "source": "sdn", "cli": null, "type": "single", "pairs": null, "objectives": "6.1–6.3"}, {"id": "q268", "domain": 5, "topic": "Automation & controllers", "level": "Concept", "stem": "Why separate policy intent from individual device CLI commands?", "options": ["To express desired outcomes that a system can translate into device configuration", "To eliminate the need for verification", "To force every device to use one vendor syntax", "To remove all security boundaries"], "correct": [0], "explanation": "Controller-based management can translate policy into implementation while operators still validate outcomes.", "source": "sdn", "cli": null, "type": "single", "pairs": null, "objectives": "6.1–6.3"}, {"id": "q269", "domain": 5, "topic": "REST APIs", "level": "Foundation", "stem": "Which HTTP method normally retrieves a resource without requesting a modification?", "options": ["GET", "POST", "DELETE", "PATCH"], "correct": [0], "explanation": "GET requests a representation. A well-designed API does not use it to perform state-changing actions.", "source": "rest", "cli": null, "type": "single", "pairs": null, "objectives": "6.5"}, {"id": "q270", "domain": 5, "topic": "REST APIs", "level": "Foundation", "stem": "Which HTTP method commonly creates a resource under a collection?", "options": ["POST", "GET", "HEAD", "OPTIONS"], "correct": [0], "explanation": "POST commonly submits data to create a new subordinate resource, subject to the API contract.", "source": "rest", "cli": null, "type": "single", "pairs": null, "objectives": "6.5"}, {"id": "q271", "domain": 5, "topic": "REST APIs", "level": "Foundation", "stem": "Which HTTP method commonly replaces the representation at a known resource URI?", "options": ["PUT", "GET", "TRACE", "HEAD"], "correct": [0], "explanation": "PUT requests creation or replacement at the target URI; replacement behavior depends on the API schema.", "source": "rest", "cli": null, "type": "single", "pair icated API call returns HTTP 403. What is the likely category of failure?", "options": ["Permission to perform the requested operation", "Always malformed JSON", "Always an unknown URL", "Always a failed TCP handshake"], "correct": [0], "explanation": "403 commonly means access is forbidden despite the request being understood; inspect policy and authorization.", "source": "rest", "cli": null, "type": "single", "pairs": null, "objectives": "6.5"}, {"id": "q277", "domain": 5, "topic": "REST APIs", "level": "Interpretation", "stem": "What does a 404 response commonly mean?", "options": ["The requested resource was not found", "The request definitely succeeded", "The response is a DNS reply", "The server has no interfaces"], "correct": [0], "explanation": "Check the URI and resource identifier; a 404 is an HTTP response rather than a transport timeout.", "source": "rest", "cli": null, "type": "single", "pairs": null, "objectives": "6.5"}, {"id": "q278", "domain": 5, "topic": "REST APIs", "level": "Interpretation", "stem": "What does HTTP 201 commonly indicate?", "options": ["A resource was created", "Authentication failed", "A resource was deleted with no content", "The server is unavailable"], "correct": [0], "explanation": "201 Created indicates successful creation; the response may identify the new resource.", "source": "rest", "cli": null, "type": "single", "pairs": null, "objectives": "6.5"}, {"id": "q279", "domain": 5, "topic": "REST APIs", "level": "Concept", "stem": "Why protect a bearer token in an API request?", "options": ["Possession can allow use of its granted permissions", "Tokens are only cosmetic labels", "Tokens cannot expire", "Tokens replace TLS encryption"], "correct": [0], "explanation": "Treat tokens as credentials, restrict their scope and avoid exposing them in logs or source code.", "source": "rest", "cli": null, "type": "single", "pairs": null, "objectives": "6.5"}, {"id": "q280", "domain": 5, "topic": "REST APIs", "level": "Concept", "stem": nt. Their proposals still need technical review and testing.", "source": "ai", "cli": null, "type": "single", "pairs": null, "objectives": "6.4"}, {"id": "q297", "domain": 5, "topic": "AI in networking", "level": "Concept", "stem": "Why validate an AI-generated network configuration before deployment?", "options": ["It can contain plausible but incorrect or unsupported commands", "AI output is always vendor-certified", "Validation only matters for wireless", "AI cannot produce syntax errors"], "correct": [0], "explanation": "Generated output may omit context or invent syntax. Check platform documentation and test behavior.", "source": "ai", "cli": null, "type": "single", "pairs": null, "objectives": "6.4"}, {"id": "q298", "domain": 5, "topic": "AI in networking", "level": "Concept", "stem": "How can machine learning help detect network anomalies?", "options": ["Learn patterns and identify departures from expected behavior", "Guarantee every anomaly is malicious", "Eliminate the need for telemetry", "Replace all physical links"], "correct": [0], "explanation": "Anomaly detection highlights unusual patterns; investigation determines whether they indicate incidents or legitimate changes.", "source": "ai", "cli": null, "type": "single", "pairs": null, "objectives": "6.4"}, {"id": "q299", "domain": 0, "topic": "Devices & cabling", "level": "Concept", "stem": "Match each component to its primary function.", "options": [], "correct": [], "explanation": "Devices play different roles: routing selects IP paths, switching handles local frames, APs provide radio access, and an IPS can enforce preventive inspection.", "source": "components", "cli": null, "type": "match", "pairs": [["Router", "Forward between IP networks"], ["Layer 2 switch", "Forward Ethernet frames by MAC"], ["Access point", "Provide wireless network access"], ["IPS", "Block detected threats inline"]], "objectives": "1.1, 1.3–1.4"}, {"id": "q300", "domain": 0, "topic": "Ethernet & TCP/IP", "level": "Concept", " nst loss of expected BPDUs"], ["PortFast", "Accelerate edge-port forwarding"]], "objectives": "2.5"}, {"id": "q304", "domain": 1, "topic": "EtherChannel", "level": "Concept", "stem": "Match each channel mode to its meaning.", "options": [], "correct": [], "explanation": "Active and passive are LACP modes; static on lacks negotiation and requires carefully matched peers.", "source": "ether", "cli": null, "type": "match", "pairs": [["LACP active", "Initiate LACP negotiation"], ["LACP passive", "Respond to LACP negotiation"], ["Static on", "Bundle without negotiation"], ["Port-channel", "Logical bundled interface"]], "objectives": "2.4"}, {"id": "q305", "domain": 1, "topic": "VLANs & trunks", "level": "Concept", "stem": "Match each VLAN term to its meaning.", "options": [], "correct": [], "explanation": "A trunk carries only its allowed VLANs; native traffic is normally untagged, and an access port can also support a voice VLAN.", "source": "vlan", "cli": null, "type": "match", "pairs": [["Access VLAN", "Data VLAN of an access port"], ["Voice VLAN", "Separate VLAN for phone traffic"], ["Native VLAN", "Normally carries untagged trunk traffic"], ["Allowed VLAN list", "Controls VLAN carriage on a trunk"]], "objectives": "2.1–2.2"}, {"id": "q306", "domain": 1, "topic": "Wireless LANs", "level": "Concept", "stem": "Match each wireless architecture term.", "options": [], "correct": [], "explanation": "Controller communication, forwarding location, AP operating mode and network identity are distinct wireless concepts.", "source": "wireless", "cli": null, "type": "match", "pairs": [["CAPWAP", "AP-controller tunnel protocol"], ["FlexConnect", "Can switch client traffic at a branch"], ["Monitor mode", "Dedicated wireless monitoring"], ["SSID", "Wireless network name"]], "objectives": "2.6–2.9"}, {"id": "q307", "domain": 2, "topic": "Routing decisions", "level": "Concept", "stem": "Match each route code to its meaning.", "options": [], "correct": [], "explanation": "Route codes identify sources; local routes identify the router itself, while connected routes cover attached subnets.", "source": "route", "cli": null, "type": "match", "pairs": [["C", "Connected network"], ["L", "Local interface host route"], ["S", "Static route"], ["O", "OSPF route"]], "objectives": "3.1–3.2"}, {"id": "q308", "domain": 2, "topic": "Static routing", "level": "Concept", "stem": "Match each IPv4 route type to the example prefix or property.", "options": [], "correct": [], "explanation": "Default is least specific, host is most specific, and floating describes source preference rather than prefix length.", "source": "route", "cli": null, "type": "match", "pairs": [["Default", "0.0.0.0/0"], ["Host", "192.0.2.10/32"], ["Network", "192.0.2.0/24"], ["Floating static", "Higher AD than the preferred same-prefix route"]], "objectives": "3.3"}, {"id": "q309", "domain": 2, "topic": "OSPF", "level": "Concept", "stem": "Match each OSPF term to its role.", "options": [], "correct": [], "explanation": "OSPF identifies routers, organizes topology information, calculates path costs and uses a DR on broadcast links.", "source": "ospf", "cli": null, "type": "match", "pairs": [["Router ID", "32-bit router identifier"], ["Area", "Link-state database scope"], ["Cost", "Path-selection metric"], ["DR", "Designated router on a broadcast segment"]], "objectives": "3.4"}, {"id": "q310", "domain": 2, "topic": "OSPF", "level": "Concept", "stem": "Match each neighbor state to its description.", "options": [], "correct": [], "explanation": "The sequence progresses from discovery to bidirectional communication and database synchronization; not every broadcast neighbor pair needs FULL.", "source": "neighbor", "cli": null, "type": "match", "pairs": [["INIT", "Hello seen without bidirectional confirmation"], ["2-WAY", "Bidirectional neighbor communication"], ["EXSTART", "Database exchange negotiation begins"], ["FULL", "Link-state databases synchronized"]], "objectives": "3.4"}, {"id": "q311", "d function topicPage(){return `${header('Practice with feedback','Follow your curiosity.','Select the topics you have studied in Jeremy’s IT Lab. Mix formats or focus on CLI interpretation. Explanations appear when you check each answer.')}${resumeBanner()}<div class="row spread"><div class="row"><button class="btn" data-action="select-all">Select all</button><button class="btn" data-action="select-none">Clear selection</button></div><span class="small muted">${BANK.length} questions · 22 matching exercises</span></div><div class="formrow"><label class="field">Session length<select id="practice-count"><option>10</option><option selected>20</option><option>30</option><option>50</option><option value="all">All matching questions</option></select></label><label class="field">Question format<select id="practice-format"><option value="all">All formats</option><option value="single">Single answer</option><option value="multi">Multiple selection</option><option value="match">Drag & drop</option><option value="cli">CLI / structured output</option></select></label><label class="field">Question selection<select id="practice-pool"><option value="all">All selected topics</option><option value="unseen">Only unattempted</option></select></label></div><div class="topicgrid">${DOMAINS.map((d,i)=>`<section class="panel domain"><div class="row spread"><h3>${i+1}. ${esc(d.name)}</h3><span class="pill bluepill">${d.weight}%</span></div><p class="small muted">Jeremy’s IT Lab: ${esc(d.jeremy)}</p>${[...new Set(BANK.filter(q=>q.domain===i).map(q=>q.topic))].map(t=>`<label class="topiccheck"><input type="checkbox" name="topic" value="${esc(t)}" ${selectedTopics.has(t)?'checked':''}>${esc(t)}<span>${BANK.filter(q=>q.topic===t).length}</span></label>`).join('')}</section>`).join('')}</div><div class="stickyactions"><span id="selection-count" class="small muted">${selectedTopics.size} topics selected</span><button class="btn primary" data-action="start-practice">Start practice →</button></div>$
