r-radius:12px;background:white;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:24px}.quizlayout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:22px}.question{font-size:21px;line-height:1.5;letter-spacing:-.3px;margin:22px 0}.terminal{background:#131820;color:#dce6f7;border-radius:9px;overflow:auto;padding:20px;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;margin:18px 0;tab-size:2}.options{display:grid;gap:10px;margin:25px 0}.option{display:flex;align-items:center;gap:13px;text-align:left;border:1px solid var(--line);border-radius:9px;padding:15px 17px;background:white;width:100%;font-size:14px}.option:hover:not(:disabled){background:#f8faff;border-color:#b7ccf5}.option.selected{border-color:var(--blue);background:var(--soft)}.letter{height:27px;width:27px;flex-shrink:0;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}.selected .letter{color:var(--blue);border-color:#b2cbff;background:white}.answerbox{border:1px solid #bfd2fa;background:#f2f6ff;padding:22px;border-radius:10px;margin:24px 0;font-size:14px}.answerbox h3{color:#1649a7}.answerbox p{margin:12px 0}.flag.on{border-color:var(--blue);background:var(--soft);color:var(--blue)}.navigator{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:16px 0}.qnum{background:white;border:1px solid var(--line);border-radius:5px;height:31px;font-size:11px;position:relative}.qnum.done{background:#e9eff9;border-color:#c9d7ee}.qnum.current{background:var(--blue);color:white;border-color:var(--blue)}.qnum.flagged:after{content:'';position:absolute;width:5px;height:5px;background:#111;right:2px;top:2px;border-radius:50%;outline:1px solid white}.timer{font:700 27px ui-monospace,Consolas,monospace;letter-spacing:-1px;margin:6px 0}.matchbank{display:flex;flex-wrap:wrap;gap:8px;padding:15px;background:var(--paper);border-radius:8px}.chip{border:1px solid #c3d3f2;padding:8px 12px;background:white;border-radius:6px;color:#244c99;font-size:12px;cursor:grab}.matchrow{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0;font-size:13px}.drop{padding:10px;border:1px dashed #afbfda;border-radius:7px;background:#fafcff}.drop select{width:100%;max-width:100%;border:0;background:transparent;color:var(--ink);font-size:12px;white-space:normal}.drop.over{background:#dbe8ff}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}td,th{padding:13px 12px;border-bottom:1px solid var(--line)}.scorebig{font-size:68px;line-height:1.1;font-weight:750;letter-spacing:-4px}.reviewitem{border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:13px 0;background:white}.reviewitem summary{cursor:pointer;font-size:14px;font-weight:650}.reviewitem .terminal{font-size:11px}.reviewmeta{color:var(--muted);font-size:11px;margin-top:7px}.footer{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.alert{background:#fff4df;color:#6e4a00;padding:12px 18px;border-bottom:1px solid #e5cf9e;font-size:12px}.hidden{display:none!important}.resume{display:flex;align-items:center;justify-content:space-between;gap:16px}.examweights{display:flex;height:8px;border-radius:8px;overflow:hidden;margin:24px 0}.examweights i:nth-child(odd){background:#2463eb}.examweights i:nth-child(even){background:#93b8ff}.mobilebrand{display:none}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#172030;color:white;padding:12px 22px;border-radius:8px;font-size:13px;z-index:20;box-shadow:0 5px 20px #0002;max-width:90vw}dialog{border:1px solid var(--line);border-radius:14px;padding:28px;max-width:460px;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#151d2b66}dialog h2{margin-b <script>const DATA={"version": "2026.11-v1.1", "questions": [{"id": "q001", "domain": 0, "topic": "Devices & cabling", "level": "Foundation", "stem": "Which device normally chooses a next hop between IP networks?", "options": ["Router", "Layer 1 hub", "Unmanaged Layer 2 switch", "Passive patch panel"], "correct": [0], "explanation": "Routing connects IP networks; a hub repeats signals and a Layer 2 switch forwards frames within a VLAN.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "1.1, 1.3–1.4"}, {"id": "q002", "domain": 0, "topic": "Devices & cabling", "level": "Foundation", "stem": "Which function distinguishes an IPS from a passive IDS?", "options": ["It can block detected malicious traffic inline", "It allocates DHCP addresses", "It replaces routing", "It only records alerts"], "correct": [0], "explanation": "An inline IPS can take preventive action. A passive detection system primarily observes and alerts.", "source": "security", "cli": null, "type": "single", "pairs": null, "objectives": "1.1, 1.3–1.4"}, {"id": "q003", "domain": 0, "topic": "Devices & cabling", "level": "Concept", "stem": "What is the primary role of a wireless access point?", "options": ["Bridge wireless clients onto a network", "Translate every private IP", "Elect the OSPF DR", "Replace the DNS hierarchy"], "correct": [0], "explanation": "An AP provides radio access and connects wireless stations with the wired infrastructure.", "source": "wireless", "cli": null, "type": "single", "pairs": null, "objectives": "1.1, 1.3–1.4"}, {"id": "q004", "domain": 0, "topic": "Devices & cabling", "level": "Concept", "stem": "Why use a wireless LAN controller for many APs?", "options": ["Centralize wireless configuration and policy", "Eliminate all RF interference", "Give every AP a public address", "Remove the need for Ethernet"], "correct": [0], "explanation": "Controller management coordinates AP settings; physical connectivity and RF planning are still necessary.", "source": "wireless", "cli": null, "type": "single", "pairs": null, "objectives": "1.1, 1.3–1.4"}, {"id": "q005", "domain": 0, "topic": "Devices & cabling", "level": "Foundation", "stem": "Which two statements about Power over Ethernet are correct?", "options": ["Electrical power can travel over Ethernet cabling", "A switch has a finite power budget", "It automatically encrypts Ethernet traffic", "It replaces IP routing", "It requires fiber instead of copper"], "correct": [0, 1], "explanation": "PoE can power compatible endpoints on Ethernet copper. The available switch power budget limits how many devices can be powered.", "source": "poe", "cli": null, "type": "multi", "pairs": null, "objectives": "1.1, 1.3–1.4"}, {"id": "q006", "domain": 0, "topic": "Devices & cabling", "level": "Troubleshooting", "stem": "A PoE switch powers existing phones but cannot power one more AP. Cabling and AP compatibility check out. What should you inspect next?", "options": ["Available PoE power budget", "OSPF router ID", "DNS search suffix", "STP root priority"], "correct": [0], "explanation": "Each powered device consumes part of the switch power budget; a valid link does not guarantee power capacity.", "source": "poe", "cli": null, "type": "single", "pairs": null, "objectives": "1.1, 1.3–1.4"}, {"id": "q007", "domain": 0, "topic": "Devices & cabling", "level": "Foundation", "stem": "Which medium is typically best for a long campus link of several kilometers?", "options": ["Single-mode fiber", "Unshielded copper at 10 km", "Console rollover cable", "Short multimode patch cable with arbitrary optics"], "correct": [0], "explanation": "Single-mode fiber and matching optics support longer distances. Always verify the transceiver reach specifications.", "source": "fiber", "cli": null, "type": "single", "pairs": null, "objectives": "1.1, 1.3–1.4"}, {"id": "q008", "domain": 0, "topic": "Devices & cabling", "level": "Concept", "stem": "Why is fiber useful between areas with strong electromagnetic interference?", "options": ["It carries light rather than electrical signaling", "It requires no transceivers", "It automatically encrypts frames", "It prevents routing loops"], "correct": [0], "explanation": "Optical signaling is resistant to electromagnetic interference; this is separate from encryption or topology control.", "source": "fiber", "cli": null, "type": "single", "pairs": null, "objectives": "1.1, 1.3–1.4"}, {"id": "q009", "domain": 0, "topic": "Devices & cabling", "level": "Troubleshooting", "stem": "A copper interface accumulates CRC errors. Which two checks are most useful first?", "options": ["Inspect cable and connectors", "Check negotiated speed and duplex", "Change the DNS domain", "Increase OSPF cost", "Rename the VLAN"], "correct": [0, 1], "explanation": "Damaged cabling and link-parameter problems can corrupt frames. CRC counters alone do not prove a single cause.", "source": "ethernet", "cli": null, "type": "multi", "pairs": null, "objectives": "1.1, 1.3–1.4"}, {"id": "q010", "domain": 0, "topic": "Devices & cabling", "level": "Troubleshooting", "stem": "A half-duplex side reports late collisions while the opposite side is forced full duplex. What is the likely problem?", "options": ["Duplex mismatch", "Native VLAN matching", "Too many DNS records", "Correct full-duplex operation"], "correct": [0], "explanation": "The two ends disagree about collision handling. Use compatible negotiation or matching supported settings.", "source": "ethernet", "cli": null, "type": "single", "pairs": null, "objectives": "1.1, 1.3–1.4"}, {"id": "q011", "domain": 0, "topic": "Devices & cabling", "level": "Interpretation", "stem": "What does this interface state identify?", "options": ["The interface is explicitly disabled in configuration", "Only DNS is unavailable", "The link is forwarding normally", "The interface has an OSPF mismatch"], "correct": [0], "explanation": "Administratively down indicates shutdown configuration. Enable it with no shutdown and then verify the physical link.", "source": "ethernet", "cli": "GigabitEthernet0/1 is administratively down, line protocol is down", "type": "single", "pairs": null, "objectives": "1.1, 1.3–1.4"}, {"id": "q012", "domain": 0, "topic": "Devices & cabling", "level": "Interpretation", "stem": "Which observation best fits this output?", "options": ["The physical link is up, but the line protocol is not operational", "The port was shut down administratively", "All Layer 3 routing is healthy", "The cable is definitely unplugged"], "correct": [0], "explanation": "The first state describes the physical interface; line protocol describes its data-link operation. More investigation is needed.", "source": "ethernet", "cli": "Serial0/0/0 is up, line protocol is down", "type": "single", "pairs": null, "objectives": "1.1, 1.3–1.4"}, {"id": "q013", "domain": 0, "topic": "Architectures & virtualization", "level": "Foundation", "stem": "A collapsed-core campus combines which traditional layers?", "options": ["Distribution and core", "Access and physical", "Transport and application", "Internet and session"], "correct": [0], "explanation": "A two-tier design commonly combines distribution and core functions while retaining the access layer.", "source": "arch", "cli": null, "type": "single", "pairs": null, "objectives": "1.2, 1.12"}, {"id": "q014", "domain": 0, "topic": "Architectures & virtualization", "level": "Concept", "stem": "In a typical spine-leaf fabric, how do leaf switches connect?", "options": ["Each leaf connects to every spine", "Each leaf connects only to its nearest leaf", "Spines connect only to endpoints", "A single daisy chain connects every switch"], "correct": [0], "explanation": "All-to-all leaf-to-spine connectivity creates predictable paths through the fabric.", "source": "arch", "cli": null, "type": "single", "pairs": null, "objectives": "1.2, 1.12"}, {"id": "q015", "domain": 0, "topic": "Architectures & virtualization", "level": "Concept", "stem": "What does a WAN primarily interconnect?", "options": ["Networks across wider geographic areas", "Only virtual machines in one host", "Only ports in one VLAN", "Only antennas within one AP"], "correct": [0], "explanation": "WAN technologies connect sites beyond an individual local-area network.", "source": "arch", "cli": null, "type": "single", "pairs": null, "objectives": "1.2, 1.12"}, {"id": "q016", "domain": 0, "topic": "Architectures & virtualization", "level": "Concept", "stem": "Which two characteristics are common in SOHO networks?", "options": ["A small number of users and devices", "An integrated router with wireless access", "A mandatory separate core layer", "No need for security controls", "Mandatory spine-leaf topology"], "correct": [0, 1], "explanation": "SOHO networks serve small offices or homes and often combine routing, switching and wireless functions. They still need appropriate security.", "source": "arch", "cli": null, "type": "multi", "pairs": null, "objectives": "1.2, 1.12"}, {"id": "q017", "domain": 0, "topic": "Architectures & virtualization", "level": "Foundation", "stem": "What is a hypervisor used for?", "options": ["Running multiple virtual machines on a host", "Resolving MAC addresses", "Providing the native VLAN", "Replacing all operating systems with JSON"], "correct": [0], "explanation": "A hypervisor allocates host resources to VMs, each of which can have its own guest operating system.", "source": "virtual", "cli": null, "type": "single", "pairs": null, "objectives": "1.2, 1.12"}, {"id": "q018", "domain": 0, "topic": "Architectures & virtualization", "level": "Concept", "stem": "Which two statements distinguish containers and full virtual machines?", "options": ["Containers commonly share a host OS kernel", "A virtual machine can have its own guest operating system", "Every container needs a dedicated physical server", "Containers cannot package dependencies", "Every VM must share its guest kernel with the host"], "correct": [0, 1], "explanation": "Containers package isolated applications around a shared kernel. Full VMs run guest OS environments managed by a hypervisor.", "source": "virtual", "cli": null, "type": "multi", "pairs": null, "objectives": "1.2, 1.12"}, {"id": "q019", "domain": 0, "topic": "Architectures & virtualization", "level": "Concept", "stem": "Why might two tenants both use 10.0.0.0/24 on one router?", "options": ["Separate VRFs maintain separate routing tables", "OSPF always removes overlapping addresses", "A VLAN tag changes the IP address", "DNS automatically translates the prefixes"], "correct": [0], "explanation": "VRFs separate routing contexts, allowing overlapping address spaces when interfaces are assigned appropriately.", "source": "vrf", "cli": null, "type": "single", "pairs": null, "objectives": "1.2, 1.12"}, {"id": "q020", "domain": 0, "topic": "Ethernet & TCP/IP", "level": "Foundation", "stem": "Which address does a switch learn from an arriving Ethernet frame?", "options": ["Source MAC address", "Destination IP address", "Destination TCP port", "Source DNS name"], "correct": [0], "explanation": "Learning associates the source MAC with the ingress port and VLAN. Destination MAC is used for the forwarding lookup.", "source": "switch", "cli": null, "type": "single", "pairs": null, "objectives": "1.5, 1.13"}, {"id": "q021", "domain": 0, "topic": "Ethernet & TCP/IP", "level": "Concept", "stem": "A switch has no entry for a unicast destination. What happens within that VLAN?", "options": ["It floods eligible ports except the ingress port", "It broadcasts to every VLAN", "It asks DNS for a port", "It always discards the frame"], "correct": [0], "explanation": "Unknown unicast flooding is confined to the VLAN and eligible forwarding ports.", "source": "switch", "cli": null, "type": "single", "pairs": null, "objectives": "1.5, 1.13"}, {"id": "q022", "domain": 0, "topic": "Ethernet & TCP/IP", "level": "Concept", "stem": "A frame arrives on the same port recorded for its destination MAC. What does a switch normally do?", "options": ["Filter the frame instead of forwarding it back", "Send it out all VLANs", "Rewrite the source IP", "Elect a new STP root"], "correct": [0], "explanation": "The destination is reachable through the incoming segment, so sending the frame back through that port is unnecessary.", "source": "switch", "cli": null, "type": "single", "pairs": null, "objectives": "1.5, 1.13"}, {"id": "q023", "domain": 0, "topic": "Ethernet & TCP/IP", "level": "Foundation", "stem": "Which address is the Ethernet broadcast address?", "options": ["FFFF.FFFF.FFFF", "0000.0000.0000", "224.0.0.5", "FF02::1"], "correct": [0], "explanation": "All 48 destination MAC bits are set for an Ethernet broadcast. The other multicast examples are IP addresses.", "source": "switch", "cli": null, "type": "single", "pairs": null, "objectives": "1.5, 1.13"}, {"id": "q024", "domain": 0, "topic": "Ethernet & TCP/IP", "level": "Concept", "stem": "Why do dynamic MAC entries age out?", "options": ["To remove stale forwarding information", "To renew DHCP leases", "To recalculate OSPF costs", "To change cable speed"], "correct": [0], "explanation": "Aging removes entries that have not been refreshed, helping the switch adapt when endpoints move or disappear.", "source": "switch", "cli": null, "type": "single", "pairs": null, "objectives": "1.5, 1.13"}, {"id": "q025", "domain": 0, "topic": "Ethernet & TCP/IP", "level": "Foundation", "stem": "Which two functions are provided by TCP?", "options": ["Ordered delivery", "Retransmission of lost data", "Mandatory encryption", "No connection setup", "MAC address learning"], "correct": [0, 1], "explanation": "TCP uses sequence numbers and acknowledgments for reliable ordered delivery. Encryption requires another mechanism.", "source": "tcp", "cli": null, "type": "multi", "pairs": null, "objectives": "1.5, 1.13"}, {"id": "q026", "domain": 0, "topic": "Ethernet & TCP/IP", "level": "Concept", "stem": "Why might real-time voice use UDP?", "options": ["It avoids TCP retransmission delays and connection overhead", "UDP guarantees every packet arrives", "UDP encrypts every voice call", "UDP eliminates jitter"], "correct": [0], "explanation": "Delay-sensitive applications can prefer timely delivery over retransmission; loss and jitter still require design attention.", "source": "tcp", "cli": null, "type": "single", "pairs": null, "objectives": "1.5, 1.13"}, {"id": "q027", "domain": 0, "topic": "Ethernet & TCP/IP", "level": "Foundation", "stem": "What identifies an application conversation at the transport layer?", "options": ["Port numbers", "VLAN names", "MAC aging timers", "Fiber core size"], "correct": [0], "explanation": "TCP and UDP ports distinguish application endpoints alongside IP addresses and the transport protocol.", "source": "tcp", "cli": null, "type": "single", "pairs": null, "objectives": "1.5, 1.13"}, {"id": "q028", "domain": 0, "topic": "Ethernet & TCP/IP", "level": "Concept", "stem": "What changes when an IPv4 packet crosses a router without NAT?", "options": ["The Layer 2 header is replaced and TTL decreases", "Both endpoint IP addresses must change", "TCP destination port must change", "The application payload is discarded"], "correct": [0], "explanation": "Routing re-encapsulates the packet for the next link and decrements TTL. Endpoint addresses remain unchanged without translation.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "1.5, 1.13"}, {"id": "q029", "domain": 0, "topic": "Ethernet & TCP/IP", "level": "Concept", "stem": "A host sends to a remote IPv4 subnet. Which MAC address does it normally use as the Ethernet destination?", "options": ["Its default gateway's local MAC", "The remote server's MAC", "Its own MAC", "The DNS server's MAC"], "correct": [0], "explanation": "The gateway is the local next hop. ARP resolves that local address; remote MAC addresses do not traverse routers.", "source": "ipv4", "cli": null, "type": "single", "pairs": null, "objectives": "1.5, 1.13"}, {"id": "q030", "domain": 0, "topic": "Ethernet & TCP/IP", "level": "Foundation", "stem": "What information does ARP resolve for a local IPv4 neighbor?", "options": ["IPv4 address to MAC address", "Hostname to IPv6 address", "TCP port to process ID", "VLAN to OSPF area"], "correct": [0], "explanation": "ARP locates the local link-layer destination needed to send an IPv4 packet on Ethernet.", "source": "ipv4", "cli": null, "type": "single", "pairs": null, "objectives": "1.5, 1.13"}, {"id": "q031", "domain": 0, "topic": "IPv4 & subnetting", "level": "Foundation", "stem": "Which address belongs to an RFC 1918 private range?", "options": ["172.20.4.8", "172.32.4.8", "11.0.0.8", "192.169.1.8"], "correct": [0], "explanation": "The private 172 range extends from 172.16.0.0 through 172.31.255.255; the surrounding 172 addresses are not all private.", "source": "ipv4", "cli": null, "type": "single", "pairs": null, "objectives": "1.6–1.7, 1.10"}, {"id": "q032", "domain": 0, "topic": "IPv4 & subnetting", "level": "Foundation", "stem": "Which two are private IPv4 prefixes?", "options": ["10.0.0.0/8", "192.168.0.0/16", "172.0.0.0/8", "192.0.0.0/8", "169.254.0.0/16"], "correct": [0, 1], "explanation": "RFC 1918 reserves 10/8, 172.16/12 and 192.168/16. Link-local 169.254/16 is a different category.", "source": "ipv4", "cli": null, "type": "multi", "pairs": null, "objectives": "1.6–1.7, 1.10"}, {"id": "q033", "domain": 0, "topic": "IPv4 & subnetting", "level": "Troubleshooting", "stem": "A Windows client self-assigns 169.254.10.20/16 instead of its normal LAN address. What should you investigate?", "options": ["DHCP reachability and lease assignment", "Whether OSPF uses area 0", "Whether the client is the STP root", "The browser homepage"], "correct": [0], "explanation": "An IPv4 link-local address commonly indicates the client did not obtain a DHCP lease; it does not identify the precise cause.", "source": "dhcp", "cli": null, "type": "single", "pairs": null, "objectives": "1.6–1.7, 1.10"}, {"id": "q034", "domain": 0, "topic": "IPv4 & subnetting", "level": "Foundation", "stem": "What is the purpose of a subnet mask?", "options": ["Separate network and host bits", "Encrypt an IPv4 header", "Identify a UDP application", "Replace a default gateway"], "correct": [0], "explanation": "The mask defines the prefix boundary used to determine whether a destination is on-link.", "source": "ipv4", "cli": null, "type": "single", "pairs": null, "objectives": "1.6–1.7, 1.10"}, {"id": "q035", "domain": 0, "topic": "IPv4 & subnetting", "level": "Concept", "stem": "Why allocate the largest subnet requirements first in VLSM planning?", "options": ["To preserve aligned blocks large enough for the biggest networks", "To force every subnet to /24", "To avoid needing routing", "To eliminate network addresses"], "correct": [0], "explanation": "Allocating large aligned blocks first reduces fragmentation of the available address space.", "source": "ipv4", "cli": null, "type": "single", "pairs": null, "objectives": "1.6–1.7, 1.10"}, {"id": "q036", "domain": 0, "topic": "IPv4 & subnetting", "level": "Troubleshooting", "stem": "A host can ping its own subnet but cannot reach any remote subnet. Which host setting is most directly relevant?", "options": ["Default gateway", "TCP receive window", "MAC aging timer", "NTP stratum"], "correct": [0], "explanation": "Off-link traffic needs a next-hop gateway. Local connectivity does not prove that gateway configuration is correct.", "source": "ipv4", "cli": null, "type": "single", "pairs": null, "objectives": "1.6–1.7, 1.10"}, {"id": "q037", "domain": 0, "topic": "IPv4 & subnetting", "level": "Interpretation", "stem": "Which Windows command shows the configured IPv4 address, mask, gateway and DNS servers?", "options": ["ipconfig /all", "show vlan brief", "display ospf peer", "traceroute -6"], "correct": [0], "explanation": "ipconfig /all displays detailed adapter configuration on Windows.", "source": "ipv4", "cli": null, "type": "single", "pairs": null, "objectives": "1.6–1.7, 1.10"}, {"id": "q038", "domain": 0, "topic": "IPv4 & subnetting", "level": "Interpretation", "stem": "Which Linux command displays interface IP addresses?", "options": ["ip address show", "show ip ospf", "net use", "vlan database"], "correct": [0], "explanation": "The ip utility provides Linux interface and routing information; ip address show lists addresses.", "source": "ipv4", "cli": null, "type": "single", "pairs": null, "objectives": "1.6–1.7, 1.10"}, {"id": "q039", "domain": 0, "topic": "IPv4 & subnetting", "level": "Concept", "stem": "Why can a host with the wrong mask fail only for some destinations?", "options": ["It may incorrectly decide a remote destination is on-link", "Masks control only DNS", "Masks assign TCP ports", "All incorrect masks immediately disable the link"], "correct": [0], "explanation": "A host that treats a remote address as local may ARP for it instead of using the gateway.", "source": "ipv4", "cli": null, "type": "single", "pairs": null, "objectives": "1.6–1.7, 1.10"}, {"id": "q040", "domain": 0, "topic": "IPv6", "level": "Foundation", "stem": "How long is an IPv6 address?", "options": ["128 bits", "32 bits", "48 bits", "64 bits"], "correct": [0], "explanation": "IPv6 has 128 address bits. A common LAN prefix is /64, but that is not the full address length.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "1.8–1.9"}, {"id": "q041", "domain": 0, "topic": "IPv6", "level": "Foundation", "stem": "Which prefix identifies IPv6 link-local addresses?", "options": ["FE80::/10", "2000::/3", "FF00::/8", "FC00::/7"], "correct": [0], "explanation": "Link-local addresses are limited to a link; global unicast, multicast and unique local use other prefixes.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "1.8–1.9"}, {"id": "q042", "domain": 0, "topic": "IPv6", "level": "Foundation", "stem": "Which prefix is reserved for IPv6 unique local addressing?", "options": ["FC00::/7", "FE80::/10", "FF00::/8", "2000::/3"], "correct": [0], "explanation": "Unique local addresses are intended for local use; locally assigned examples commonly start with FD.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "1.8–1.9"}, {"id": "q043", "domain": 0, "topic": "IPv6", "level": "Concept", "stem": "What is IPv6 anycast?", "options": ["The same unicast address on multiple nodes, reached through routing to one instance", "One packet delivered to every node", "A special broadcast header", "An address usable only on loopbacks"], "correct": [0], "explanation": "Anycast relies on routing to deliver to a selected, typically topologically nearest, instance.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "1.8–1.9"}, {"id": "q044", "domain": 0, "topic": "IPv6", "level": "Foundation", "stem": "What replaces IPv4-style broadcasts in IPv6 for many discovery functions?", "options": ["Multicast", "Directed broadcasts", "Classful addressing", "NAT overload"], "correct": [0], "explanation": "IPv6 does not define broadcast addressing; multicast serves group communication needs.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "1.8–1.9"}, {"id": "q045", "domain": 0, "topic": "IPv6", "level": "Concept", "stem": "What does modified EUI-64 do to a 48-bit MAC when constructing an interface ID?", "options": ["Insert FFFE and invert the universal/local bit", "Insert FFFF without changing bits", "Remove the vendor prefix", "Hash it into 32 bits"], "correct": [0], "explanation": "The identifier becomes 64 bits by insertion, and the U/L bit is toggled. Other IPv6 interface-ID methods also exist.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "1.8–1.9"}, {"id": "q046", "domain": 0, "topic": "IPv6", "level": "Foundation", "stem": "Which IPv6 address represents loopback?", "options": ["::1", "::", "FF02::1", "FE80::"], "correct": [0], "explanation": "Loopback identifies the local host. The all-zero address :: is the unspecified address.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "1.8–1.9"}, {"id": "q047", "domain": 0, "topic": "IPv6", "level": "Concept", "stem": "How many times may :: appear in one compressed IPv6 address?", "options": ["Once", "Twice", "Four times", "Any number"], "correct": [0], "explanation": "A single omitted run has an unambiguous length. Multiple :: runs would make reconstruction ambiguous.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "1.8–1.9"}, {"id": "q048", "domain": 0, "topic": "IPv6", "level": "Troubleshooting", "stem": "An IPv6 static route uses a link-local next hop on Ethernet. What additional information is needed?", "options": ["Outgoing interface", "DNS suffix", "NAT pool", "802.1X username"], "correct": [0], "explanation": "A link-local address is scoped to its link, so the router needs an interface to identify that link.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "1.8–1.9"}, {"id": "q049", "domain": 0, "topic": "IPv6", "level": "Foundation", "stem": "Which global command enables IPv6 packet forwarding on Cisco IOS routers?", "options": ["ipv6 unicast-routing", "ip routing ipv6", "ipv6 enable all", "router ipv6"], "correct": [0], "explanation": "An interface IPv6 address alone is not the global IPv6 forwarding switch; ipv6 unicast-routing enables forwarding.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "1.8–1.9"}, {"id": "q050", "domain": 0, "topic": "IPv6", "level": "Concept", "stem": "Which protocol supports IPv6 neighbor discovery?", "options": ["ICMPv6", "ARPv6", "TCP only", "RIPv1"], "correct": [0], "explanation": "Neighbor Discovery uses ICMPv6 messages, including neighbor and router solicitations and advertisements.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "1.8–1.9"}, {"id": "q051", "domain": 0, "topic": "IPv6", "level": "Interpretation", "stem": "Which is the fully expanded form of 2001:db8:1::a?", "options": ["2001:0db8:0001:0000:0000:0000:0000:000a", "2001:0db8:0001:0000:0000:0000:000a:0000", "2001:0db8:0000:0001:0000:0000:0000:000a", "2001:0db8:0001:0000:0000:0000:0000:00a0"], "correct": [0], "explanation": "Expand to eight groups of four hexadecimal digits, preserving the nonzero group positions.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "1.8–1.9"}, {"id": "q052", "domain": 0, "topic": "Wireless principles", "level": "Foundation", "stem": "Which 2.4 GHz channels are a common nonoverlapping 20 MHz plan in the US?", "options": ["1, 6 and 11", "1, 2 and 3", "3, 4 and 5", "6, 7 and 8"], "correct": [0], "explanation": "The separation between these channels avoids the substantial overlap of adjacent 2.4 GHz channels.", "source": "wireless", "cli": null, "type": "single", "pairs": null, "objectives": "1.11"}, {"id": "q053", "domain": 0, "topic": "Wireless principles", "level": "Foundation", "stem": "What is an SSID?", "options": ["A wireless network name", "An AP's IPv4 subnet mask", "An OSPF process number", "A mandatory encryption key"], "correct": [0], "explanation": "Clients select wireless networks by SSID; the name itself does not provide security.", "source": "wireless", "cli": null, "type": "single", "pairs": null, "objectives": "1.11"}, {"id": "q054", "domain": 0, "topic": "Wireless principles", "level": "Concept", "stem": "Why can increasing channel width reduce usable channel reuse?", "options": ["Wider channels occupy more spectrum", "It disables authentication", "It shortens MAC addresses", "It removes all interference"], "correct": [0], "explanation": "Greater width may increase potential throughput but leaves fewer nonoverlapping choices in a limited band.", "source": "wireless", "cli": null, "type": "single", "pairs": null, "objectives": "1.11"}, {"id": "q055", "domain": 0, "topic": "Wireless principles", "level": "Troubleshooting", "stem": "Nearby APs on overlapping 2.4 GHz channels have poor throughput. What change is most appropriate to evaluate?", "options": ["A nonoverlapping channel plan and appropriate transmit power", "Disable encryption everywhere", "Put every AP at maximum power", "Change all clients to static DNS"], "correct": [0], "explanation": "RF planning addresses interference; excessive power or overlapping channels can make performance worse.", "source": "wireless", "cli": null, "type": "single", "pairs": null, "objectives": "1.11"}, {"id": "q056", "domain": 0, "topic": "Wireless principles", "level": "Concept", "stem": "With similar power and conditions, why may 2.4 GHz reach farther indoors than 5 GHz?", "options": ["Lower-frequency signals generally experience less propagation loss", "It always uses more antennas", "It has no interference", "Its frames have no headers"], "correct": [0], "explanation": "Propagation depends on frequency and obstacles. Real coverage also depends on power, antennas and the building.", "source": "wireless", "cli": null, "type": "single", "pairs": null, "objectives": "1.11"}, {"id": "q057", "domain": 0, "topic": "Architectures & virtualization", "level": "Concept", "stem": "What does public cloud computing typically allow an organization to do?", "options": ["Consume provider-hosted computing resources on demand", "Avoid all security responsibility", "Replace every LAN switch", "Guarantee zero latency"], "correct": [0], "explanation": "Cloud services offer remotely hosted capacity; responsibilities and network latency still need consideration.", "source": "arch", "cli": null, "type": "single", "pairs": null, "objectives": "1.2, 1.12"}, {"id": "q058", "domain": 0, "topic": "Ethernet & TCP/IP", "level": "Interpretation", "stem": "A switch learns the same MAC on a new port in the same VLAN. What normally changes?", "options": ["The MAC table points to the new ingress port", "The endpoint must get a new IP", "The switch disables all trunks", "The VLAN changes automatically"], "correct": [0], "explanation": "Dynamic learning updates the location of the source MAC. Rapid repeated moves may warrant investigation.", "source": "switch", "cli": null, "type": "single", "pairs": null, "objectives": "1.5, 1.13"}, {"id": "q059", "domain": 0, "topic": "Devices & cabling", "level": "Concept", "stem": "Which Ethernet mode permits simultaneous sending and receiving without collisions?", "options": ["Full duplex", "Half duplex", "Shared hub mode", "CSMA/CD collision mode"], "correct": [0], "explanation": "Full-duplex point-to-point Ethernet has independent transmit and receive operation; normal collisions should not occur.", "source": "ethernet", "cli": null, "type": "single", "pairs": null, "objectives": "1.1, 1.3–1.4"}, {"id": "q060", "domain": 0, "topic": "IPv6", "level": "Concept", "stem": "How does a SLAAC host learn the network prefix?", "options": ["Router Advertisement", "ARP Reply", "DNS MX response", "DHCPv4 Offer"], "correct": [0], "explanation": "Router Advertisements carry prefix information and router availability. SLAAC does not require a DHCPv6 address assignment.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "1.8–1.9"}, {"id": "q061", "domain": 1, "topic": "VLANs & trunks", "level": "Foundation", "stem": "Which two statements about VLANs are correct?", "options": ["Each VLAN forms a separate broadcast domain", "Routing is needed for normal communication between different VLAN subnets", "Every VLAN needs its own physical switch", "VLANs encrypt all user frames", "A trunk can carry only one VLAN"], "correct": [0, 1], "explanation": "A VLAN separates Layer 2 broadcast scope. Layer 3 forwarding connects IP subnets associated with different VLANs.", "source": "vlan", "cli": null, "type": "multi", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q062", "domain": 1, "topic": "VLANs & trunks", "level": "Foundation", "stem": "What is the default access VLAN on a typical Cisco switch?", "options": ["VLAN 1", "VLAN 0", "VLAN 1002", "VLAN 4095"], "correct": [0], "explanation": "Access interfaces normally start in VLAN 1 until configured otherwise.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q063", "domain": 1, "topic": "VLANs & trunks", "level": "Concept", "stem": "Two PCs are in different VLANs. What is needed for normal IP communication between them?", "options": ["Layer 3 routing between their subnets", "Only matching switch hostnames", "Only a crossover cable", "Disabling STP"], "correct": [0], "explanation": "Layer 2 VLAN separation requires a router or Layer 3 switch for inter-VLAN forwarding.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q064", "domain": 1, "topic": "VLANs & trunks", "level": "Interpretation", "stem": "Which interface command assigns an access port to VLAN 20?", "options": ["switchport access vlan 20", "switchport trunk native vlan 20", "ip vlan 20", "vlan access 20"], "correct": [0], "explanation": "The access VLAN setting selects the data VLAN for an access port; trunk native VLAN is a different setting.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q065", "domain": 1, "topic": "VLANs & trunks", "level": "Concept", "stem": "A PC connects through an IP phone. Which arrangement is commonly supported?", "options": ["Separate data access VLAN and tagged voice VLAN on the switch port", "Exactly one mandatory shared IP subnet", "Two OSPF areas on the phone", "No VLAN tagging for any phone traffic"], "correct": [0], "explanation": "The phone can tag voice traffic while the attached PC uses the data access VLAN.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q066", "domain": 1, "topic": "VLANs & trunks", "level": "Foundation", "stem": "Which standard tags Ethernet frames with VLAN information on trunks?", "options": ["IEEE 802.1Q", "IEEE 802.3af", "IEEE 802.1X", "IEEE 802.11ax"], "correct": [0], "explanation": "802.1Q identifies VLAN membership across a trunk. The other standards concern PoE, access control and wireless.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q067", "domain": 1, "topic": "VLANs & trunks", "level": "Concept", "stem": "By default, how is native VLAN traffic sent on an 802.1Q trunk?", "options": ["Untagged", "Always encrypted", "Double tagged", "Sent only by UDP"], "correct": [0], "explanation": "Native traffic is normally untagged unless native VLAN tagging has been explicitly configured.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q068", "domain": 1, "topic": "VLANs & trunks", "level": "Troubleshooting", "stem": "A trunk has native VLAN 10 on one end and 20 on the other. What risk does this create?", "options": ["Untagged traffic can enter different VLANs at opposite ends", "All TCP ports change", "OSPF metrics become negative", "Fiber optics automatically fail"], "correct": [0], "explanation": "Each end classifies untagged frames into its own native VLAN, producing inconsistent VLAN membership.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q069", "domain": 1, "topic": "VLANs & trunks", "level": "Interpretation", "stem": "VLAN 30 exists on both switches but cannot cross this link. What configuration directly explains it?", "options": ["VLAN 30 is absent from the allowed list", "VLAN 30 must be the native VLAN", "The interface is necessarily shut down", "The trunk uses the wrong routing protocol"], "correct": [0], "explanation": "A VLAN must be allowed on the trunk to carry its traffic; existence in the VLAN database is insufficient.", "source": "vlan", "cli": "Port      Mode  Encapsulation Status    Native vlan\nGi0/1     on    802.1q        trunking  1\nPort      Vlans allowed on trunk\nGi0/1     10,20", "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q070", "domain": 1, "topic": "VLANs & trunks", "level": "Interpretation", "stem": "Which command adds VLAN 30 while retaining existing trunk allowances?", "options": ["switchport trunk allowed vlan add 30", "switchport trunk allowed vlan 30", "switchport access vlan 30", "no switchport trunk allowed vlan"], "correct": [0], "explanation": "The add keyword modifies the allowed set. Omitting it replaces the set with the specified list.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q071", "domain": 1, "topic": "VLANs & trunks", "level": "Troubleshooting", "stem": "Two ports are both dynamic auto and remain access ports. What explains this?", "options": ["Neither side actively initiates trunk negotiation", "Both sides are forced trunks", "LACP is active", "The native VLAN must be 4095"], "correct": [0], "explanation": "Two passive DTP auto ports do not negotiate a trunk. Explicit trunk configuration removes this ambiguity.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q072", "domain": 1, "topic": "VLANs & trunks", "level": "Interpretation", "stem": "Which command directly reports operational trunk links and allowed VLAN lists?", "options": ["show interfaces trunk", "show ip route", "show arp", "show ntp associations"], "correct": [0], "explanation": "Trunk output shows operational state and VLAN forwarding information.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q073", "domain": 1, "topic": "VLANs & trunks", "level": "Interpretation", "stem": "What is the purpose of encapsulation dot1Q 40 on a router subinterface?", "options": ["Associate that subinterface with VLAN 40 traffic", "Assign IP address 0.0.0.40", "Enable DHCP snooping", "Set OSPF priority 40"], "correct": [0], "explanation": "Router-on-a-stick subinterfaces use VLAN encapsulation and an IP address to route for the associated VLAN.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q074", "domain": 1, "topic": "VLANs & trunks", "level": "Troubleshooting", "stem": "A multilayer switch has correctly addressed SVIs but does not route between VLANs. What global setting should you verify?", "options": ["ip routing", "ip domain lookup only", "service timestamps only", "spanning-tree portfast default only"], "correct": [0], "explanation": "SVIs provide Layer 3 interfaces; the switch also needs routing enabled to forward between them.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q075", "domain": 1, "topic": "VLANs & trunks", "level": "Concept", "stem": "Which range is normally described as normal-range VLAN IDs?", "options": ["1 through 1005", "0 through 4095", "1006 through 4094", "1 through 255"], "correct": [0], "explanation": "Normal range includes reserved legacy VLANs 1002–1005. Not all IDs in the range are available for ordinary user assignment.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q076", "domain": 1, "topic": "VLANs & trunks", "level": "Troubleshooting", "stem": "An SVI is administratively enabled but down. Which condition should you verify?", "options": ["The VLAN exists and has an active eligible forwarding port", "The SVI has a public address", "DNS is enabled on every port", "The VLAN number equals the mask length"], "correct": [0], "explanation": "SVI line state commonly depends on VLAN activity and autostate rules; platform details can vary.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q077", "domain": 1, "topic": "STP", "level": "Foundation", "stem": "What problem does STP prevent in redundant Layer 2 topologies?", "options": ["Forwarding loops", "Duplicate DNS names", "Every possible security attack", "IPv4 address exhaustion"], "correct": [0], "explanation": "STP blocks selected redundant paths to create a loop-free forwarding topology.", "source": "stp", "cli": null, "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q078", "domain": 1, "topic": "STP", "level": "Concept", "stem": "Which bridge becomes the STP root?", "options": ["The bridge with the lowest bridge ID", "The highest IP address", "The most physical ports", "The fastest CPU"], "correct": [0], "explanation": "Bridge ID compares priority, including system-ID extension, and then MAC address.", "source": "stp", "cli": null, "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q079", "domain": 1, "topic": "STP", "level": "Interpretation", "stem": "Two switches have equal STP priority in one VLAN. Which becomes root?", "options": ["The one with the lower MAC address", "The one with the higher MAC address", "The one with more trunks", "The one with a higher hostname alphabetically"], "correct": [0], "explanation": "MAC address breaks a bridge-ID tie when the priority components are equal.", "source": "stp", "cli": null, "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q080", "domain": 1, "topic": "STP", "level": "Concept", "stem": "What is a root port on a nonroot switch?", "options": ["Its selected best path toward the root bridge", "Every access port", "A port only on the root bridge", "The highest-numbered interface"], "correct": [0], "explanation": "A nonroot bridge selects one root port per spanning-tree instance based on path and tie-break criteria.", "source": "stp", "cli": null, "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q081", "domain": 1, "topic": "STP", "level": "Concept", "stem": "What is a designated port on a segment?", "options": ["The selected port offering that segment the best path to the root", "Always a blocked port", "Always the highest port number", "Only a router interface"], "correct": [0], "explanation": "The designated port is the forwarding representative for that segment in the STP topology.", "source": "stp", "cli": null, "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q082", "domain": 1, "topic": "STP", "level": "Foundation", "stem": "Which three are RSTP port states?", "options": ["Discarding", "Learning", "Forwarding", "Listening", "Initializing"], "correct": [0, 1, 2], "explanation": "RSTP consolidates legacy disabled, blocking and listening behavior into discarding, while retaining learning and forwarding.", "source": "stp", "cli": null, "type": "multi", "pairs": null, "objectives": "2.5"}, {"id": "q083", "domain": 1, "topic": "STP", "level": "Concept", "stem": "Does an RSTP learning port forward user frames?", "options": ["No, but it can learn source MAC addresses", "Yes, all user frames", "Only frames from the root router", "Only multicast IPv6"], "correct": [0], "explanation": "Learning populates MAC information before the port begins user-data forwarding.", "source": "stp", "cli": null, "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q084", "domain": 1, "topic": "STP", "level": "Foundation", "stem": "What does PortFast change on an appropriate edge port?", "options": ["It allows rapid transition to forwarding", "It disables all STP processing permanently", "It elects the local switch as root", "It enables a trunk automatically"], "correct": [0], "explanation": "PortFast is intended for edge connections. It avoids normal startup delay but is not a substitute for loop protection.", "source": "stp", "cli": null, "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q085", "domain": 1, "topic": "STP", "level": "Troubleshooting", "stem": "A PortFast edge port with BPDU guard becomes error-disabled after a switch is connected. Why?", "options": ["It received a BPDU", "Its DNS lookup failed", "Its OSPF cost was too high", "It received a DHCP ACK"], "correct": [0], "explanation": "BPDU guard protects an edge assumption by disabling a port that receives a BPDU.", "source": "stp", "cli": null, "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q086", "domain": 1, "topic": "STP", "level": "Concept", "stem": "Which STP feature prevents a downstream switch from becoming root through a protected port?", "options": ["Root guard", "PortFast alone", "DHCP relay", "LACP passive"], "correct": [0], "explanation": "Root guard places the port into a root-inconsistent state if superior BPDUs would make it a root path.", "source": "stp", "cli": null, "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q087", "domain": 1, "topic": "STP", "level": "Concept", "stem": "Which feature helps stop a blocked port from forwarding when expected BPDUs disappear?", "options": ["Loop guard", "NAT overload", "DNSSEC", "Voice VLAN"], "correct": [0], "explanation": "Loop guard can hold the affected port in a loop-inconsistent condition instead of allowing an unsafe transition.", "source": "stp", "cli": null, "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q088", "domain": 1, "topic": "STP", "level": "Concept", "stem": "Why is interface-level BPDU filtering dangerous on an interswitch link?", "options": ["It can suppress loop-detection information", "It always encrypts BPDUs", "It prevents all Layer 3 traffic", "It guarantees a better root election"], "correct": [0], "explanation": "Suppressing BPDUs can defeat STP's loop prevention. BPDU filtering behavior depends on how it is configured.", "source": "stp", "cli": null, "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q089", "domain": 1, "topic": "STP", "level": "Interpretation", "stem": "What does this output tell you about Gi0/2?", "options": ["It is an alternate path currently discarding user traffic", "It is the root bridge", "It is a routed interface", "It is forwarding all VLANs"], "correct": [0], "explanation": "Alternate ports provide a redundant path. BLK output corresponds to nonforwarding behavior.", "source": "stp", "cli": "Interface  Role Sts Cost\nGi0/1      Root FWD 4\nGi0/2      Altn BLK 4", "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q090", "domain": 1, "topic": "STP", "level": "Concept", "stem": "What does Rapid PVST+ maintain?", "options": ["A separate rapid spanning-tree instance per VLAN", "One shared IP routing table for all routers", "One TCP session per MAC", "A single mandatory instance for every VLAN"], "correct": [0], "explanation": "Per-VLAN instances allow distinct root and path choices across VLANs.", "source": "stp", "cli": null, "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q091", "domain": 1, "topic": "EtherChannel", "level": "Foundation", "stem": "What does EtherChannel provide?", "options": ["Multiple physical links acting as one logical link", "Automatic IP subnet allocation", "A separate DNS server", "Mandatory encryption"], "correct": [0], "explanation": "Bundling provides aggregate capacity and redundancy while presenting a logical port-channel.", "source": "ether", "cli": null, "type": "single", "pairs": null, "objectives": "2.4"}, {"id": "q092", "domain": 1, "topic": "EtherChannel", "level": "Foundation", "stem": "Which LACP mode actively sends negotiation messages?", "options": ["active", "passive", "auto", "desirable"], "correct": [0], "explanation": "Active initiates LACP negotiation. Auto and desirable belong to PAgP rather than LACP.", "source": "ether", "cli": null, "type": "single", "pairs": null, "objectives": "2.4"}, {"id": "q093", "domain": 1, "topic": "EtherChannel", "level": "Concept", "stem": "Which two LACP pairings can form a channel when other parameters match?", "options": ["active / active", "active / passive", "passive / passive", "auto / passive", "desirable / active"], "correct": [0, 1], "explanation": "LACP requires at least one active participant. Active/active and active/passive can negotiate; auto and desirable are PAgP modes.", "source": "ether", "cli": null, "type": "multi", "pairs": null, "objectives": "2.4"}, {"id": "q094", "domain": 1, "topic": "EtherChannel", "level": "Troubleshooting", "stem": "Both peers use LACP passive and no channel forms. What is a minimal fix?", "options": ["Change one peer to active", "Change both to dynamic auto", "Change one native VLAN to a different value", "Remove the port-channel interface address only"], "correct": [0], "explanation": "One active peer initiates the LACP exchange while the other can remain passive.", "source": "ether", "cli": null, "type": "single", "pairs": null, "objectives": "2.4"}, {"id": "q095", "domain": 1, "topic": "EtherChannel", "level": "Concept", "stem": "Which two settings should be consistent among Layer 2 channel members?", "options": ["Trunk/access configuration", "Allowed VLAN list", "Physical port number", "Device hostname", "Console password"], "correct": [0, 1], "explanation": "Members must be compatible at Layer 2. Different physical numbers or device hostnames do not prevent bundling.", "source": "ether", "cli": null, "type": "multi", "pairs": null, "objectives": "2.4"}, {"id": "q096", "domain": 1, "topic": "EtherChannel", "level": "Interpretation", "stem": "What does the P flag identify for these member interfaces?", "options": ["They are bundled in the port-channel", "They are passive OSPF interfaces", "They are power-disabled", "They are routed host ports"], "correct": [0], "explanation": "P indicates bundled membership; SU indicates a Layer 2 channel in use.", "source": "ether", "cli": "Group Port-channel Protocol Ports\n1     Po1(SU)      LACP     Gi0/1(P) Gi0/2(P)", "type": "single", "pairs": null, "objectives": "2.4"}, {"id": "q097", "domain": 1, "topic": "EtherChannel", "level": "Concept", "stem": "Where should the IP address of a Layer 3 EtherChannel be configured?", "options": ["On the logical port-channel", "Separately using the same IP on every member", "Only on a loopback", "On the native VLAN statement"], "correct": [0], "explanation": "The bundle is one logical Layer 3 interface. Physical members should be configured compatibly as routed ports.", "source": "ether", "cli": null, "type": "single", "pairs": null, "objectives": "2.4"}, {"id": "q098", "domain": 1, "topic": "EtherChannel", "level": "Concept", "stem": "Why does one TCP flow often fail to use the sum of all EtherChannel member speeds?", "options": ["A hash normally assigns that flow to one member", "LACP transmits all data at 1 Mbps", "Channels never provide bandwidth benefits", "TCP cannot run over Ethernet"], "correct": [0], "explanation": "Aggregation distributes multiple flows. One flow generally remains on one link to preserve ordering.", "source": "ether", "cli": null, "type": "single", "pairs": null, "objectives": "2.4"}, {"id": "q099", "domain": 1, "topic": "EtherChannel", "level": "Troubleshooting", "stem": "A two-link channel remains up after one member fails. What changes?", "options": ["Available aggregate capacity decreases", "The channel must lose its IP address", "All VLANs are deleted", "The switch must reboot"], "correct": [0], "explanation": "Remaining members can continue forwarding, but fewer physical links reduce available bandwidth.", "source": "ether", "cli": null, "type": "single", "pairs": null, "objectives": "2.4"}, {"id": "q100", "domain": 1, "topic": "Discovery & management", "level": "Foundation", "stem": "Which discovery protocol is an IEEE standard?", "options": ["LLDP", "CDP", "DTP", "PAgP"], "correct": [0], "explanation": "LLDP is standardized as IEEE 802.1AB; CDP is Cisco's discovery protocol.", "source": "discovery", "cli": null, "type": "single", "pairs": null, "objectives": "2.3, 2.8"}, {"id": "q101", "domain": 1, "topic": "Discovery & management", "level": "Interpretation", "stem": "Which command reveals directly connected Cisco neighbors and their port IDs?", "options": ["show cdp neighbors", "show ip nat translations", "show access-lists", "show ntp status"], "correct": [0], "explanation": "CDP reports local links, device IDs, capabilities and remote port IDs where enabled.", "source": "discovery", "cli": null, "type": "single", "pairs": null, "objectives": "2.3, 2.8"}, {"id": "q102", "domain": 1, "topic": "Discovery & management", "level": "Concept", "stem": "Can CDP discover a device several routers away through routed forwarding?", "options": ["No, it discovers directly connected neighbors", "Yes, all Internet routers", "Only through DNS", "Only if every router is DR"], "correct": [0], "explanation": "CDP is a link-local discovery mechanism; ordinary routing does not propagate its advertisements.", "source": "discovery", "cli": null, "type": "single", "pairs": null, "objectives": "2.3, 2.8"}, {"id": "q103", "domain": 1, "topic": "Discovery & management", "level": "Foundation", "stem": "Which management protocol encrypts a CLI session?", "options": ["SSH", "Telnet", "TFTP", "Plain HTTP"], "correct": [0], "explanation": "SSH protects the management session. Telnet sends session content without equivalent encryption.", "source": "ssh", "cli": null, "type": "single", "pairs": null, "objectives": "2.3, 2.8"}, {"id": "q104", "domain": 1, "topic": "Discovery & management", "level": "Concept", "stem": "Which access method is useful when remote IP connectivity is broken?", "options": ["Console access", "HTTPS to the failed IP path", "SNMP over the same failed route", "Telnet through the same outage"], "correct": [0], "explanation": "A local console connection does not require normal network-layer connectivity to the device.", "source": "ssh", "cli": null, "type": "single", "pairs": null, "objectives": "2.3, 2.8"}, {"id": "q105", "domain": 1, "topic": "Discovery & management", "level": "Foundation", "stem": "Which web-management option provides transport encryption?", "options": ["HTTPS", "HTTP", "TFTP", "CDP"], "correct": [0], "explanation": "HTTPS uses TLS to protect the browser-to-device session, subject to correct certificate validation.", "source": "ssh", "cli": null, "type": "single", "pairs": null, "objectives": "2.3, 2.8"}, {"id": "q106", "domain": 1, "topic": "Wireless LANs", "level": "Foundation", "stem": "Which protocol carries control between a lightweight AP and its WLC?", "options": ["CAPWAP", "HSRP", "DTP", "ARP"], "correct": [0], "explanation": "CAPWAP provides controller/AP communication; centrally switched WLAN data can also be tunneled.", "source": "wireless", "cli": null, "type": "single", "pairs": null, "objectives": "2.6–2.9"}, {"id": "q107", "domain": 1, "topic": "Wireless LANs", "level": "Concept", "stem": "What is a key FlexConnect capability?", "options": ["Local switching of selected client traffic at a branch", "Mandatory tunneling of all traffic in every configuration", "Replacing the branch router with DNS", "Disabling all authentication"], "correct": [0], "explanation": "FlexConnect can switch WLAN traffic locally, depending on policy and configuration.", "source": "wireless", "cli": null, "type": "single", "pairs": null, "objectives": "2.6–2.9"}, {"id": "q108", "domain": 1, "topic": "Wireless LANs", "level": "Concept", "stem": "What does an AP in monitor mode primarily do?", "options": ["Scan and monitor wireless conditions rather than serve ordinary clients", "Become the default gateway", "Act as an LACP peer", "Assign public IP addresses"], "correct": [0], "explanation": "Monitor mode dedicates the AP to monitoring tasks instead of normal client service.", "source": "apmodes", "cli": null, "type": "single", "pairs": null, "objectives": "2.6–2.9"}, {"id": "q109", "domain": 1, "topic": "Wireless LANs", "level": "Troubleshooting", "stem": "Clients associate to a WLAN but obtain addresses from the wrong subnet. Which mapping should you inspect?", "options": ["WLAN-to-VLAN/policy mapping", "AP hostname spelling", "OSPF router ID", "Syslog severity names"], "correct": [0], "explanation": "The WLAN's mapped VLAN determines the Layer 2 segment and therefore its expected DHCP scope.", "source": "wireless", "cli": null, "type": "single", "pairs": null, "objectives": "2.6–2.9"}, {"id": "q110", "domain": 1, "topic": "Wireless LANs", "level": "Concept", "stem": "Why might a FlexConnect AP need a trunk uplink?", "options": ["To locally switch multiple client VLANs", "Because all AP links must carry every VLAN", "Because CAPWAP cannot cross routed networks", "To become an STP root"], "correct": [0], "explanation": "Local switching across several VLANs requires appropriate tagging and VLAN allowance on the AP uplink.", "source": "wireless", "cli": null, "type": "single", "pairs": null, "objectives": "2.6–2.9"}, {"id": "q111", "domain": 1, "topic": "Wireless LANs", "level": "Troubleshooting", "stem": "A newly configured WLAN is not visible to clients. Which two GUI settings are relevant first?", "options": ["WLAN enabled status", "SSID and broadcast settings", "Router console baud rate", "OSPF dead interval", "NAT inside global address"], "correct": [0, 1], "explanation": "An administratively disabled WLAN or hidden SSID can explain visibility behavior; radio and AP policy also matter.", "source": "wireless", "cli": null, "type": "multi", "pairs": null, "objectives": "2.6–2.9"}, {"id": "q112", "domain": 1, "topic": "Wireless LANs", "level": "Concept", "stem": "What is the purpose of a voice QoS profile on a WLAN?", "options": ["Give suitable treatment to delay-sensitive voice traffic", "Make all traffic encrypted twice", "Create new RF spectrum", "Guarantee no packet loss"], "correct": [0], "explanation": "QoS classifies and prioritizes traffic; it cannot create capacity or guarantee an interference-free radio link.", "source": "wireless", "cli": null, "type": "single", "pairs": null, "objectives": "2.6–2.9"}, {"id": "q113", "domain": 1, "topic": "Wireless LANs", "level": "Concept", "stem": "What does a WLC link aggregation group combine?", "options": ["Multiple wired uplinks into a logical bundle", "Multiple SSIDs into one password", "Multiple client IPs into one DHCP lease", "Several RF bands into one channel"], "correct": [0], "explanation": "LAG concerns the wired uplinks. Supported negotiation and configuration details depend on controller platform.", "source": "wireless", "cli": null, "type": "single", "pairs": null, "objectives": "2.6–2.9"}, {"id": "q114", "domain": 1, "topic": "VLANs & trunks", "level": "Troubleshooting", "stem": "An access PC in VLAN 10 can reach a same-switch peer but not a peer in VLAN 10 on another switch. Which is the best next check?", "options": ["VLAN 10 forwarding on the interswitch trunk", "The PC's browser cache", "Whether VLAN 10 has a public subnet", "The OSPF DR priority on the PC"], "correct": [0], "explanation": "Local success narrows the failure toward the interswitch path, including allowed VLANs and spanning-tree state.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q115", "domain": 1, "topic": "Discovery & management", "level": "Interpretation", "stem": "What does this output most directly identify?", "options": ["SW2 connects to local Gi0/1 using its Gi0/24", "SW2 is four routers away", "SW2 is definitely the root bridge", "Gi0/1 has an IP address of 24"], "correct": [0], "explanation": "Discovery neighbor output maps local and remote physical interfaces; it does not establish routing or STP roles.", "source": "discovery", "cli": "Device ID  Local Intf  Capability  Port ID\nSW2        Gi0/1       S I         Gi0/24", "type": "single", "pairs": null, "objectives": "2.3, 2.8"}, {"id": "q116", "domain": 1, "topic": "VLANs & trunks", "level": "Troubleshooting", "stem": "A router subinterface uses VLAN 50 but the switch trunk allows only 10 and 20. What change is required for VLAN 50 clients?", "options": ["Allow VLAN 50 on the trunk and verify that VLAN is active", "Make the router an LACP passive peer", "Change all clients to loopback addresses", "Disable the router's ARP table"], "correct": [0], "explanation": "The tagged frames must reach the router subinterface through an allowed, active VLAN.", "source": "vlan", "cli": null, "type": "single", "pairs": null, "objectives": "2.1–2.2"}, {"id": "q117", "domain": 1, "topic": "STP", "level": "Concept", "stem": "What happens to a root-guard port when superior BPDUs stop arriving and conditions recover?", "options": ["It can automatically leave the root-inconsistent state", "It requires replacing the switch", "It becomes a DNS server", "It deletes all VLANs"], "correct": [0], "explanation": "Root guard blocks an undesirable root path while the condition exists; recovery is automatic when the condition clears.", "source": "stp", "cli": null, "type": "single", "pairs": null, "objectives": "2.5"}, {"id": "q118", "domain": 1, "topic": "EtherChannel", "level": "Troubleshooting", "stem": "Channel members have different native VLAN settings. What should you do first?", "options": ["Make the member configurations consistent", "Increase the DNS TTL", "Set all OSPF priorities to zero", "Remove the default route"], "correct": [0], "explanation": "Inconsistent VLAN settings can prevent a valid bundle and cause suspended members or mismatched behavior.", "source": "ether", "cli": null, "type": "single", "pairs": null, "objectives": "2.4"}, {"id": "q119", "domain": 2, "topic": "Routing decisions", "level": "Foundation", "stem": "What does a router primarily examine to forward an ordinary unicast IP packet?", "options": ["Destination IP address", "Destination DNS label", "Source TCP sequence number", "Ethernet preamble"], "correct": [0], "explanation": "The forwarding lookup matches the destination against installed routes.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q120", "domain": 2, "topic": "Routing decisions", "level": "Concept", "stem": "Which installed route wins when several prefixes match a packet?", "options": ["The route with the longest matching prefix", "Always the lowest administrative distance", "Always the static route", "The route learned most recently"], "correct": [0], "explanation": "Prefix specificity governs forwarding. Administrative distance selects between candidate sources for the same prefix during route installation.", "source": "ad", "cli": null, "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q121", "domain": 2, "topic": "Routing decisions", "level": "Interpretation", "stem": "An OSPF /24 and a static /16 are installed. A destination matches both. Which is used?", "options": ["OSPF /24", "Static /16", "Whichever has the lower next-hop IP", "Neither because protocols differ"], "correct": [0], "explanation": "The /24 matches more destination bits. The static route's lower administrative distance does not override specificity.", "source": "ad", "cli": null, "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q122", "domain": 2, "topic": "Routing decisions", "level": "Foundation", "stem": "What is administrative distance used to compare?", "options": ["Preference of route sources for the same prefix", "Cable lengths", "Only OSPF interface speeds", "TCP session priorities"], "correct": [0], "explanation": "AD is a local route-source preference. It is not a universal measure of path quality.", "source": "ad", "cli": null, "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q123", "domain": 2, "topic": "Routing decisions", "level": "Interpretation", "stem": "What do the bracketed numbers mean?", "options": ["Administrative distance 110 and metric 20", "Metric 110 and hop count 20", "Prefix length 110 and VLAN 20", "Bandwidth 110 Mbps and delay 20 ms"], "correct": [0], "explanation": "Cisco route output uses [administrative distance/metric].", "source": "ad", "cli": "O 10.20.0.0/16 [110/20] via 192.0.2.2, GigabitEthernet0/0", "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q124", "domain": 2, "topic": "Routing decisions", "level": "Foundation", "stem": "What route code identifies a directly connected network?", "options": ["C", "L", "O", "S"], "correct": [0], "explanation": "C marks the connected subnet. L marks a local host route for an interface's own address.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q125", "domain": 2, "topic": "Routing decisions", "level": "Interpretation", "stem": "Why is there an L /32 route for 192.168.1.1?", "options": ["It identifies the router's own IPv4 interface address", "It represents every host on the LAN", "It is a learned default route", "It is an OSPF loop"], "correct": [0], "explanation": "The local host route directs packets addressed to the router itself for local processing.", "source": "route", "cli": "C 192.168.1.0/24 is directly connected, Gi0/0\nL 192.168.1.1/32 is directly connected, Gi0/0", "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q126", "domain": 2, "topic": "Routing decisions", "level": "Concept", "stem": "No installed route matches a destination, and there is no default. What does the router normally do?", "options": ["Drop the packet, possibly generating ICMP unreachable", "Flood it out every interface", "Ask DNS to choose a route", "Send it to the lowest MAC address"], "correct": [0], "explanation": "A router needs a matching forwarding entry. It does not use Layer 2 flooding to discover an IP path.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q127", "domain": 2, "topic": "Routing decisions", "level": "Foundation", "stem": "What is the IPv4 default route prefix?", "options": ["0.0.0.0/0", "0.0.0.0/32", "255.255.255.255/32", "127.0.0.0/8"], "correct": [0], "explanation": "A zero-length prefix matches every IPv4 address and is used when no more-specific route applies.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q128", "domain": 2, "topic": "Routing decisions", "level": "Foundation", "stem": "Which has the lowest default administrative distance?", "options": ["Connected route", "OSPF route", "RIP route", "Ordinary static route"], "correct": [0], "explanation": "Connected routes have AD 0; ordinary static routes have AD 1 and OSPF has AD 110.", "source": "ad", "cli": null, "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q129", "domain": 2, "topic": "Routing decisions", "level": "Concept", "stem": "Can you directly compare an OSPF cost of 10 to a RIP metric of 2 to choose a protocol?", "options": ["No; the metrics have different meanings", "Yes; 2 always wins", "Yes; 10 always wins", "Only when DNS is working"], "correct": [0], "explanation": "Different protocols calculate metrics differently. Route-source selection uses administrative distance for an identical prefix.", "source": "ad", "cli": null, "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q130", "domain": 2, "topic": "Routing decisions", "level": "Concept", "stem": "Two equal-cost OSPF routes to the same prefix are installed. What can the router do?", "options": ["Use equal-cost multipath forwarding", "Discard both routes", "Prefer the highest administrative distance", "Convert the prefix to a host route"], "correct": [0], "explanation": "Supported ECMP behavior allows traffic distribution across equal eligible next hops; distribution need not alternate every packet.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "3.1–3.2"}, {"id": "q131", "domain": 2, "topic": "Static routing", "level": "Interpretation", "stem": "Which command installs an IPv4 default route through 192.0.2.1?", "options": ["ip route 0.0.0.0 0.0.0.0 192.0.2.1", "ip route 0.0.0.0 255.255.255.255 192.0.2.1", "ip default-route 192.0.2.1", "router default 192.0.2.1"], "correct": [0], "explanation": "The destination and mask are both zero for an IPv4 default static route.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "3.3"}, {"id": "q132", "domain": 2, "topic": "Static routing", "level": "Interpretation", "stem": "Which route targets only 10.1.2.3?", "options": ["ip route 10.1.2.3 255.255.255.255 192.0.2.2", "ip route 10.1.2.0 255.255.255.0 192.0.2.2", "ip route 10.0.0.0 255.0.0.0 192.0.2.2", "ip route 0.0.0.0 0.0.0.0 192.0.2.2"], "correct": [0], "explanation": "A /32 route matches one IPv4 address, while shorter prefixes cover broader networks.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "3.3"}, {"id": "q133", "domain": 2, "topic": "Static routing", "level": "Concept", "stem": "What makes a static route floating?", "options": ["An administrative distance above the preferred route's distance", "A dynamic DNS hostname", "A mandatory loopback next hop", "A metric of zero alone"], "correct": [0], "explanation": "It stays out of the active table while the preferred route for the same prefix remains available.", "source": "ad", "cli": null, "type": "single", "pairs": null, "objectives": "3.3"}, {"id": "q134", "domain": 2, "topic": "Static routing", "level": "Interpretation", "stem": "Will this backup route replace a working default-AD OSPF route to the same /24?", "options": ["No; its AD 120 is higher than OSPF's 110", "Yes; static always wins", "Yes; 120 is more preferred", "No; static routes cannot back up OSPF"], "correct": [0], "explanation": "The elevated distance makes the static route a backup for the identical prefix.", "source": "ad", "cli": "ip route 10.10.10.0 255.255.255.0 192.0.2.2 120", "type": "single", "pairs": null, "objectives": "3.3"}, {"id": "q135", "domain": 2, "topic": "Static routing", "level": "Troubleshooting", "stem": "A next-hop-only static route is configured but absent from the routing table. What should you check?", "options": ["Whether the next hop can be resolved through a usable route", "Whether DNS uses TCP", "Whether the console is logged in", "Whether the hostname is uppercase"], "correct": [0], "explanation": "A configured route may be ineligible if its next hop cannot be resolved. Configuration presence does not guarantee installation.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "3.3"}, {"id": "q136", "domain": 2, "topic": "Static routing", "level": "Interpretation", "stem": "Which command installs an IPv6 default through global next hop 2001:db8:1::1?", "options": ["ipv6 route ::/0 2001:db8:1::1", "ip route ::/0 2001:db8:1::1", "ipv6 route ::/128 2001:db8:1::1", "ipv6 default-gateway ::/64"], "correct": [0], "explanation": "IPv6 uses prefix notation; ::/0 is the default destination.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "3.3"}, {"id": "q137", "domain": 2, "topic": "Static routing", "level": "Foundation", "stem": "What prefix length identifies an IPv6 host route?", "options": ["/128", "/32", "/64", "/127"], "correct": [0], "explanation": "A host route matches all 128 bits of one IPv6 address.", "source": "ipv6", "cli": null, "type": "single", "pairs": null, "objectives": "3.3"}, {"id": "q138", "domain": 2, "topic": "Static routing", "level": "Concept", "stem": "Why can a forward static route alone be insufficient for ping?", "options": ["A usable return path is also needed", "ICMP never crosses routers", "All static routes require DNS", "Ping works only inside one VLAN"], "correct": [0], "explanation": "The request and reply both need routing. A valid outward path does not establish return reachability.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "3.3"}, {"id": "q139", "domain": 2, "topic": "Static routing", "level": "Troubleshooting", "stem": "A router can ping its WAN peer but not a remote LAN. What should you verify next?", "options": ["Routes to the remote LAN and the return path", "Only the console password", "Only the AP's channel", "Whether the cable uses PoE"], "correct": [0], "explanation": "Reaching the adjacent peer confirms the local link, not the full path to the remote subnet.", "source": "route", "cli": null, "type": "single", "pairs": null, "objectives": "3.3"}, {"id": "q140", "domain": 2, "topic": "OSPF", "level": "Foundation", "stem": "What type of routing protocol is OSPF?", "options": ["Link-state IGP", "Distance-vector EGP", "Layer 2 discovery protocol", "Transport protocol"], "correct": [0], "explanation": "OSPF distributes link-state information within an autonomous system and calculates shortest paths.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q141", "domain": 2, "topic": "OSPF", "level": "Foundation", "stem": "Which algorithm does OSPF use to calculate paths?", "options": ["Dijkstra shortest-path first", "DNS recursion", "CSMA/CD", "Round-robin ARP"], "correct": [0], "explanation": "SPF builds shortest paths from the link-state database using OSPF costs.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q142", "domain": 2, "topic": "OSPF", "level": "Concept", "stem": "Must OSPF process IDs match on neighboring Cisco routers?", "options": ["No; the process ID is locally significant", "Yes; they must always be 1", "Only when the router IDs match", "Only on Ethernet"], "correct": [0], "explanation": "Neighbors must agree on relevant link parameters, but their local process numbers may differ.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q143", "domain": 2, "topic": "OSPF", "level": "Foundation", "stem": "Which OSPF area is the backbone area?", "options": ["Area 0", "Area 1", "Area 255", "The area with the largest router ID"], "correct": [0], "explanation": "Area 0 is the OSPF backbone. Single-area CCNA practice commonly uses it.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q144", "domain": 2, "topic": "OSPF", "level": "Concept", "stem": "What does the OSPF network command select on IOS?", "options": ["Local interfaces whose addresses match its address and wildcard", "Only remote destination networks to install", "A DHCP address pool", "The DR's MAC address"], "correct": [0], "explanation": "The command enables OSPF on matching local interfaces and assigns them to the specified area.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q145", "domain": 2, "topic": "OSPF", "level": "Interpretation", "stem": "Which interface address matches this network statement?", "options": ["10.1.2.14", "10.1.3.14", "10.2.2.14", "11.1.2.14"], "correct": [0], "explanation": "A zero wildcard bit must match; 0.0.0.255 permits any final octet within 10.1.2.0/24.", "source": "ospf", "cli": "network 10.1.2.0 0.0.0.255 area 0", "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q146", "domain": 2, "topic": "OSPF", "level": "Foundation", "stem": "What is the format of an OSPF router ID?", "options": ["A 32-bit value displayed like an IPv4 address", "A 128-bit IPv6 multicast address", "A 48-bit MAC address", "A VLAN name"], "correct": [0], "explanation": "Router IDs identify OSPF routers. The ID need not itself be a currently reachable interface address.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q147", "domain": 2, "topic": "OSPF", "level": "Concept", "stem": "What takes precedence in OSPF router-ID selection?", "options": ["An explicitly configured router-id", "The lowest physical MAC", "The DNS domain", "The lowest interface cost"], "correct": [0], "explanation": "A manually configured ID has precedence. Otherwise IOS considers eligible loopback and other interface IPv4 addresses.", "source": "ospf", "cli": null, "type": "single", "pairs": null, "objectives": "3.4"}, {"id": "q148", "domain": 2, "topic": "OSPF", "level": "Concept", "stem": "Without a manual ID, which is preferred when loopbacks exist at OSPF initialization?", "options": ["Th
